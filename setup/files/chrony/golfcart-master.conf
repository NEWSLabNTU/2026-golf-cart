# Golf Cart: serve time to the orin over the LAN.
# Installed to /etc/chrony/conf.d/ by setup/scripts/install-chrony-timesync.sh
#
# The master keeps its own upstream pools (see /etc/chrony/chrony.conf) for
# absolute time. This file only adds the server role.

# The orin is the only client, but the cart's LAN is small and static.
allow 192.168.125.0/24

# Keep serving when the 4G uplink is down, which on a vehicle is most of the
# time. Without this, chronyd refuses to answer clients while unsynchronised and
# the two hosts drift apart exactly when they are recording.
#
# Stratum 10 is deliberately poor: any real upstream outranks it, so the master
# falls back to serving its own clock rather than competing with the pools.
local stratum 10
