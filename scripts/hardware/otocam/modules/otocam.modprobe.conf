# -> /etc/modprobe.d/otocam.conf
#
# max9296 needs clk_en=1 to drive the IMX390 sensor clock.
options max9296 clk_en=1

# Block udev alias autoload. The i2c devices appear as soon as i2c@3180000
# probes, which is before max9296 (with clk_en=1) and the tegra camera stack
# (tegra_camera_platform, nvhost_vi5, tegra_camera_rtcpu) are up. The vendor
# probe fails hard there and udev never retries, so no /dev/video* appears.
# otocam.service loads both modules explicitly, in order, after udev settles.
# blacklist only suppresses alias-driven autoload; modprobe by name still works.
blacklist max9296
blacklist nv_imx390
