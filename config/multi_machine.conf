# multi_machine.conf - identities of the master/orin pair, in one tracked place.
#
# Sourced by the multi-machine scripts:
#   scripts/multi_machine/on_orin.sh         - where to run remote commands
#   scripts/multi_machine/bag_fetch_orin.sh  - which orin to pull rosbags from
#   scripts/multi_machine/setup_ssh.sh       - which orin to install a key on
#   scripts/multi_machine/watchdog.sh        - which master the orin pings
#
# Before this file each of those carried its own hardcoded copy of the same two
# values: three places to keep in sync, and nothing that noticed when they drifted.
# See docs/design/orin_provisioning_implementation_plan.md section 4.4.
#
# Format: shell-sourceable, assignments only, no commands. Consumers do
#
#   [ -f config/multi_machine.conf ] && . config/multi_machine.conf
#
# so a missing or renamed file degrades to each script's own built-in default
# rather than failing - the file is a single source of truth, not a hard
# dependency.
#
# Overrides: every key takes its value from the GOLFCART_-prefixed environment
# variable of the same name when that variable is set, so the overrides the
# scripts already document keep working and still win over this file:
#
#   ORIN_SSH      <-  GOLFCART_ORIN_SSH
#   MASTER_IP     <-  GOLFCART_MASTER_IP
#   ORIN_SSH_KEY  <-  GOLFCART_ORIN_SSH_KEY
#
# Change the value after ':-' to move the checked-in default for every host;
# export the GOLFCART_* variable to move it for one shell or one unit only.
# The ':-' form (not ':=' and not a blind assignment) is what makes re-sourcing
# this file idempotent and keeps an exported override intact.

# ssh destination of the orin (slave) host - the machine carrying the ZED camera
# and its own recorder. Must be reachable with key-based auth: every script here
# runs ssh with BatchMode=yes and will fail rather than prompt. Run
# scripts/multi_machine/setup_ssh.sh once to install the key.
ORIN_SSH="${GOLFCART_ORIN_SSH:-jetson@192.168.125.101}"

# Address the orin's watchdog pings to decide the master is still alive. It is
# the master's address on the shared 192.168.125.0/24 LAN (enP5p3s0), not a
# hostname: name resolution is one more thing that can fail on the exact link
# whose loss the watchdog exists to detect.
MASTER_IP="${GOLFCART_MASTER_IP:-192.168.125.100}"

# Private key used to reach the orin. A DEDICATED, FIXED path - deliberately not
# ~/.ssh/id_*, so setup_ssh.sh never has to touch or overwrite a key the user
# already relies on for GitHub or anything else.
#
# Every consumer passes this with `ssh -i`, which is what makes the fixed name
# workable. ssh on its own only ever tries the default names (id_ed25519, id_rsa,
# ...), so a differently-named key is invisible to it unless an agent happens to
# be holding it. That is exactly how this bit us: the working key was
# ~/.ssh/golfcart_slave, reachable only through the desktop keyring agent, so
# ssh succeeded by hand and failed under systemd - which carries no agent - with
# a bare "Permission denied (publickey,password)".
#
# Point this at another path to adopt an existing key instead of generating one;
# scripts/multi_machine/setup_ssh.sh creates whatever path this names.
ORIN_SSH_KEY="${GOLFCART_ORIN_SSH_KEY:-${HOME}/.ssh/golfcart_orin}"

# Where the repository lives on the orin. Both machines carry the same checkout,
# and orchestration is "log in and run the same recipe over there", so this is the
# directory every remote command cd's into first.
#
# Accepts `~/path` or an absolute `/path`. The tilde is expanded by the REMOTE
# shell, not this one - the orin's home is not necessarily this machine's - so it
# is deliberately left unexpanded here and passed through as written.
ORIN_WORKSPACE="${GOLFCART_ORIN_WORKSPACE:-~/2026-golf-cart}"
