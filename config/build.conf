# Which workspace packages `just build` builds on this machine.
#
# Sourced by the justfile's build recipe after scripts/env.sh, keyed on
# GOLFCART_HOST (config/host, or a unit's GOLFCART_ENV_ROLE). A host with no
# entry here builds the whole workspace, which is what the master and a
# development machine want.
#
#   BUILD_UP_TO     colcon --packages-up-to: these and their dependencies only.
#                   Empty means every package under src/.
#   BUILD_IGNORE    colcon --packages-ignore, joined to the recipe's own skips
#                   (ZED SDK, DBC) into ONE flag; colcon keeps only the last
#                   --packages-ignore it is given.
#
# `just build --all` ignores BUILD_UP_TO and BUILD_IGNORE for one run.
#
# The orin runs the ZED, the CAN vehicle interface, the link bridge and the
# system monitor, and nothing else: the Autoware stack and every other sensor
# are on the master. BUILD_UP_TO is what `play_launch dump ... golfcart.launch.yaml
# host:=orin` resolves to (2026-10-22: 13 nodes from these packages), plus the
# two operator tools that drive the cart from the machine on the CAN bus,
# `just vehicle manual-control` (autoware_manual_control) and
# `just vehicle control-straight|control-circle` (control_test). Rerun the dump
# when golfcart.launch.yaml's orin side changes.
#
# BUILD_IGNORE exists because --packages-up-to follows RUN dependencies too:
# golfcart_sensor_kit_launch exec-depends on every sensor driver it can launch,
# so without it the orin would build gmslcam, the u-blox stack, seyond and the
# Xsens driver. Those run on the master. gmslcam cannot build on the orin at all
# (it resolves its ROS interface crates from crates.io, which the orin cannot
# reach), and ublox_gps needs mavros_msgs, which is not installed there.
#
# The orin also has no route to crates.io, so cargo runs offline there and
# resolves from ~/.cargo/registry, filled from the master's:
#     rsync -a ~/.cargo/registry/{cache,index} jetson@<orin>:.cargo/registry/
case "${GOLFCART_HOST:-}" in
    orin)
        BUILD_UP_TO="golfcart_launch golfcart_vehicle_launch golfcart_vehicle_interface golfcart_vehicle_description golfcart_domain_bridge golfcart_system_monitor golfcart_sensor_kit_launch zed_wrapper zed_components autoware_manual_control control_test"
        BUILD_IGNORE="gmslcam ublox ublox_gps ublox_msgs ublox_serialization seyond xsens_mti_can_ros_driver"
        export CARGO_NET_OFFLINE="${CARGO_NET_OFFLINE:-true}"
        ;;
    *)
        BUILD_UP_TO=""
        BUILD_IGNORE=""
        ;;
esac
