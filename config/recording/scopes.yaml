# Recording scopes: what a session records, per host role. The single source;
# scripts/recording/session.py is the only reader.
#
#   just record start [SCOPE] [NAME]     both hosts, SCOPE defaults to `default:`
#   just record scopes                   classes, topic counts per host, each scope
#
# Per scope (and per role, where a role entry overrides the scope's own `ros`):
#   ros:  all              ros2 bag record -a (every topic, hidden ones included)
#         [class, ...]     the topics of these classes, config/recording/topics.yaml.
#                          `first-hand` stands for every class of that kind, so
#                          a first-hand class added later joins without an edit
#                          here; `computed` likewise.
#         none             no bag (the default when nothing says otherwise)
#   can:  CAN interfaces, each recorded with `candump -L` to <iface>.log
#   pcap: Ethernet interfaces, each captured with rootless tshark to <iface>.pcapng;
#         per entry `iface`, optional `filter` (capture filter), optional `snaplen`
#
# A role's topics are its own half of each class (topics.yaml `master:` / `orin:`
# / `both:`). An interface that is missing or DOWN when the session starts is
# skipped and recorded as skipped in session.yaml; the rest of the session goes
# ahead. A role this file does not name (a single-machine checkout) records the
# union of master and orin.
#
# Replay leaves the computed classes out by default (scripts/recording/play.py),
# so recording them never pins a logging simulation to the values frozen here.

default: drive

# Free space under recordings/ checked before every start. Below it a scope with
# `disk: refuse` will not start; any other scope starts with a warning.
min_free_gb: 20

# Interface sets, referenced below. Verified with `ip -br link` 2026-11-09.
interfaces:
  master_can: &master_can [can0, can1]   # both UP; the VCU bus moved to the orin
  orin_can: &orin_can [can0]             # VCU, 500 kbit/s. can1 is DOWN, unused
  master_pcap: &master_pcap
    - iface: enP5p4s0                    # Velodyne VLP-32C, 192.168.7.x
    - iface: enP5p5s0                    # Seyond Falcon, 172.168.1.x, also PTP
    - iface: enP5p3s0                    # cart LAN 192.168.125.x (the link domain)
      filter: "not tcp port 22"          # leave out our own ssh / rsync
  orin_pcap: &orin_pcap
    - iface: eno1                        # cart LAN
      filter: "not tcp port 22"

# Class lists, referenced below. Everything `drive` recorded before topic
# classes is still in it (first-hand + sensing_derived + diagnostics +
# vehicle_cmd); localization is what it adds.
class_sets:
  drive: &drive [first-hand, sensing_derived, diagnostics, vehicle_cmd, localization]
  autonomy: &autonomy [first-hand, sensing_derived, diagnostics, vehicle_cmd, localization,
                       planning, control, perception]

scopes:
  all:
    description: every topic, every CAN bus, every sensor NIC and the cart LAN
    disk: refuse
    master: {ros: all, can: *master_can, pcap: *master_pcap}
    orin:   {ros: all, can: *orin_can,   pcap: *orin_pcap}

  drive:
    description: sensors, vehicle reports and commands, TF, diagnostics and the localization outputs (NDT, EKF), plus every CAN bus; the everyday drive
    ros: *drive
    master: {can: *master_can}
    orin:   {can: *orin_can}

  localize:
    description: same as drive; the name from before topic classes, kept so old commands work
    ros: *drive
    master: {can: *master_can}
    orin:   {can: *orin_can}

  autonomy:
    description: drive plus what the stack decided (route, trajectory, controller, operation mode, objects, occupancy grid); for an engaged run
    ros: *autonomy
    master: {can: *master_can}
    orin:   {can: *orin_can}

  raw:
    description: raw packets only, CAN and Ethernet, no ROS
    master: {ros: none, can: *master_can, pcap: *master_pcap}
    orin:   {ros: none, can: *orin_can,   pcap: *orin_pcap}

  can:
    description: CAN only
    master: {can: *master_can}
    orin:   {can: *orin_can}

  ros:
    description: the first-hand classes only (sensors, vehicle reports, TF), no CAN; what `just bag record` records
    ros: [first-hand]
