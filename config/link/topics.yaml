# config/link/topics.yaml - what crosses the master/orin link, and in which
# direction.
#
# Read by golfcart_domain_bridge, one process per host, started by
# golfcart.launch.yaml whenever host:=master or host:=orin. Both hosts read
# THIS file: a topic listed under orin_to_master is published by the orin's
# bridge into the link domain and subscribed by the master's bridge out of it.
# One list, no mirror to keep in step.
#
# Why a list exists at all: everything else on either host lives in that
# host's stack domain (50 master, 60 orin) bound to `lo` and cannot reach the
# wire (config/cyclonedds/{master,orin}.xml). The link domain (10,
# GOLFCART_LINK_DOMAIN_ID, config/runtime.conf) holds only the two bridges. So the wire carries exactly what is written here, plus the
# discovery traffic of two participants, and nothing an operator's `ros2 topic
# echo` on either host can add to it.
#
# Per entry:
#   topic        absolute name; the same name on both sides
#   type         pkg/msg/Type; the type support library must be installed on
#                BOTH hosts, or that host's bridge logs an error and skips it
#   reliability  reliable | best_effort   (default best_effort)
#   durability   volatile | transient_local (default volatile)
#   depth        history depth, both ends   (default 10)
#   max_hz       drop samples to hold this rate on the link, 0 = every sample
#                (default 0). This is the knob for an image: the ZED's
#                compressed stream is ~6.5 MB/s at 30 Hz, half the link.
#
# QoS applies to BOTH ends of a bridged topic, and must satisfy two matches:
#   - the bridge's subscription against the source publisher: a reliable
#     subscription matches only a reliable publisher; best_effort matches both
#   - the bridge's publisher against the destination subscribers: a best_effort
#     publisher is invisible to a reliable subscriber
# Read the consumer's subscription before choosing. The bridge logs
# "requesting incompatible QoS" when a destination subscriber cannot match,
# and `ros2 topic info -v` on the destination host shows every subscriber's
# policy. Everything listed today is reliable because every consumer is.
#
# Never list one topic in both directions. The bridge refuses to start if you
# do, because the alternative is an echo loop across the link.
#
# Services live under `services:`, keyed by the direction of the REQUEST. The
# same rule holds: never in both directions.

orin_to_master:
  # The vehicle's IMU while IMU_SOURCE=zed (config/sensors.conf). RELIABLE on
  # both ends, because both ends are: the ZED wrapper publishes every topic
  # with rclcpp::QoS(10) (zed_camera_component_main.cpp, mQos), and Autoware's
  # imu_corrector subscribes reliable. A best_effort lane here matched the
  # publisher and was invisible to the consumer; the bridge logged
  # "requesting incompatible QoS ... RELIABILITY" and imu_corrector got nothing.
  # Found by running the real stack against the bridge (scripts/testing/link_sim).
  - topic: /sensing/camera/zed/imu/data
    type: sensor_msgs/msg/Imu
    reliability: reliable
    depth: 10

  # The ZED wrapper broadcasts zed_left_camera_frame -> zed_imu_link on /tf as
  # a DYNAMIC transform at the sensor rate (publish_imu_tf: true in
  # zed.param.yaml; a cart bag held 43k of them). Without it gyro_odometer on
  # the master cannot transform the IMU into base_link and silently drops
  # every sample: every node stays healthy and the EKF never gets a twist
  # (the comment in ntu_logging_sim.launch.xml). One direction only: the
  # master's own /tf never goes to the orin, so there is no loop.
  - topic: /tf
    type: tf2_msgs/msg/TFMessage
    reliability: reliable
    depth: 100

  # Intrinsics for whatever on the master consumes the ZED image later. Small,
  # 30 Hz; the image itself stays on the orin (recorded there, see
  # config/recording/orin_topics.txt). At the camera's 30 Hz the compressed
  # image is 7.0 MB/s payload = 55 Mbit/s of the 100 Mbit/s link, measured
  # (docs/research/system/domain-split-link-pressure.md), and at that rate it
  # already costs the IMU samples. To look at it on the master, add
  #   - topic: /sensing/camera/zed/rgb/color/rect/image/compressed
  #     type: sensor_msgs/msg/CompressedImage
  #     reliability: reliable      # the wrapper publishes reliable; RViz subscribes reliable
  #     max_hz: 5                  # ~9 Mbit/s; 2 Hz is ~3.7
  # and watch `just link pressure` before and after.
  - topic: /sensing/camera/zed/rgb/color/rect/camera_info
    type: sensor_msgs/msg/CameraInfo
    reliability: reliable
    depth: 5

  # The orin's system monitor rows, for the master's diagnostic aggregator and
  # the web UI on :8080. diagnostic_aggregator subscribes reliable.
  - topic: /diagnostics
    type: diagnostic_msgs/msg/DiagnosticArray
    reliability: reliable
    depth: 100

  # The ZED's URDF subtree, published once per static publisher on the orin.
  # transient_local so a tf2 listener on the master that starts later still
  # gets it; the depth is the number of latched samples the bridge keeps, and
  # has to cover every static publisher on the orin.
  - topic: /tf_static
    type: tf2_msgs/msg/TFMessage
    reliability: reliable
    durability: transient_local
    depth: 50

  # /sensing/camera/zed/status/health (zed_msgs/msg/Health) is deliberately
  # absent: zed_msgs is not built on a host without the ZED SDK, so the master
  # bridge could not load the type. It is recorded on the orin.

  # The vehicle interface runs on the orin (vehicle_host:=orin, golfcart.launch.yaml),
  # where can0 is. Its reports come back here for the stack: velocity feeds
  # vehicle_velocity_converter -> gyro_odometer -> EKF, and the rest feed
  # control, planning and the operation-mode manager. Reliable/volatile depth 10
  # because that is what the interface publishes with (rclrs default QoS) and
  # every Autoware consumer subscribes reliable. ~50 Hz each, tens of bytes.
  - topic: /vehicle/status/velocity_status
    type: autoware_vehicle_msgs/msg/VelocityReport
    reliability: reliable
    depth: 10
  - topic: /vehicle/status/steering_status
    type: autoware_vehicle_msgs/msg/SteeringReport
    reliability: reliable
    depth: 10
  - topic: /vehicle/status/gear_status
    type: autoware_vehicle_msgs/msg/GearReport
    reliability: reliable
    depth: 10
  - topic: /vehicle/status/control_mode
    type: autoware_vehicle_msgs/msg/ControlModeReport
    reliability: reliable
    depth: 10
  - topic: /vehicle/status/turn_indicators_status
    type: autoware_vehicle_msgs/msg/TurnIndicatorsReport
    reliability: reliable
    depth: 10
  - topic: /vehicle/status/hazard_lights_status
    type: autoware_vehicle_msgs/msg/HazardLightsReport
    reliability: reliable
    depth: 10
  - topic: /vehicle/status/actuation_status
    type: tier4_vehicle_msgs/msg/ActuationStatusStamped
    reliability: reliable
    depth: 10

# The vehicle interface's commands, from vehicle_cmd_gate and the e-stop on the
# master to the interface on the orin. RELIABLE with depth 1 on both ends,
# because the interface subscribes KeepLast(1) Reliable (node.rs, cmd_qos): a
# superseded command is worth nothing, a lost one stalls the watchdog. If the
# link drops, these stop, and the interface's control_timeout_ms watchdog
# (500 ms) brakes the cart -- the failure is a stop, not a runaway.
master_to_orin:
  - topic: /control/command/control_cmd
    type: autoware_control_msgs/msg/Control
    reliability: reliable
    depth: 1
  - topic: /control/command/gear_cmd
    type: autoware_vehicle_msgs/msg/GearCommand
    reliability: reliable
    depth: 1
  - topic: /control/command/turn_indicators_cmd
    type: autoware_vehicle_msgs/msg/TurnIndicatorsCommand
    reliability: reliable
    depth: 1
  - topic: /control/command/hazard_lights_cmd
    type: autoware_vehicle_msgs/msg/HazardLightsCommand
    reliability: reliable
    depth: 1
  - topic: /control/command/emergency_cmd
    type: tier4_vehicle_msgs/msg/VehicleEmergencyStamped
    reliability: reliable
    depth: 1
  - topic: /vehicle/emergency_stop
    type: std_msgs/msg/Bool
    reliability: reliable
    depth: 1

# Services cross the link too, by request direction. Each type must be compiled
# into the bridge (service_types() in golfcart_domain_bridge), because Humble
# has no generic service. A request whose far end is down is left unanswered,
# so the caller sees its own timeout rather than a fabricated reply.
services:
  # Autoware's engage path (operation_mode_transition_manager) asks the vehicle
  # interface for AUTONOMOUS here; the interface answers from the VCU's report.
  master_to_orin:
    - service: /control/control_mode_request
      type: autoware_vehicle_msgs/srv/ControlModeCommand
