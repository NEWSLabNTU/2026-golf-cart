# vehicle.conf - vehicle interface switches that must survive the launch chain.
#
# Sourced by scripts/env.sh, so shells and systemd units agree.
#
# Like config/sensors.conf, these are ENVIRONMENT variables rather than launch
# arguments, and for the same forced reason: golfcart_autoware.launch.xml
# includes the installed tier4_vehicle_launch/vehicle.launch.xml, which forwards
# exactly three arguments to our vehicle_interface.launch.xml
# (vehicle_id, raw_vehicle_cmd_converter_param_path, initial_engage_state) and
# drops everything else. `just launch "tx_enabled:=true"` would look like it
# works and do nothing. vehicle_interface.launch.xml reads
# $(env GOLFCART_TX_ENABLED false) instead, and the environment is the only
# channel that survives the trip.
#
# Every key keeps an already-set value, so a one-off override still wins:
#     GOLFCART_TX_ENABLED=true just launch
#     just launch tx=on                 # same thing, via the justfile
#
# `just vehicle interface tx=on` does NOT go through here: that path bypasses
# Autoware and passes tx_enabled:= as a real launch argument.

# CAN TX master enable for golfcart_vehicle_interface: true | false
#
# ⚠️  true puts real frames on can0 and the cart can be commanded into motion.
#     Default false: with TX off the node only listens, /vehicle/status/* and
#     /diagnostics still fill in, and nothing we publish can move the vehicle.
#
# This is deliberately not sticky across a deployment: `just launch-up` sets it
# per invocation and `just launch-down` clears it, so today's tx=on cannot
# silently apply to tomorrow's launch. Set it here only to change the resting
# default for a machine, and understand that it then applies to every launch.
GOLFCART_TX_ENABLED="${GOLFCART_TX_ENABLED:-false}"

# Normalise to the two literals ROS 2 launch will accept as a bool parameter
# value. `on`/`yes`/`1` are what a human types; `tx_enabled:=on` would reach the
# node as a string and fail the parameter's type check at start-up.
case "${GOLFCART_TX_ENABLED}" in
    true | on | yes | 1)   GOLFCART_TX_ENABLED=true ;;
    false | off | no | 0)  GOLFCART_TX_ENABLED=false ;;
    *)
        echo "WARNING: GOLFCART_TX_ENABLED='${GOLFCART_TX_ENABLED}' is not a boolean; using false." >&2
        GOLFCART_TX_ENABLED=false
        ;;
esac
