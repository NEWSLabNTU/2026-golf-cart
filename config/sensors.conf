# sensors.conf - which sensor a driver-level choice resolves to.
#
# Sourced by scripts/env.sh, so shells and systemd units agree.
#
# These are ENVIRONMENT variables, not launch arguments, and that is not a style
# choice. golfcart.launch.yaml's `imu_source:=` / `camera_model:=` arguments reach
# golfcart_autoware.launch.xml, but the path onwards runs through two installed
# Autoware files (tier4_sensing_component.launch.xml and
# tier4_sensing_launch/sensing.launch.xml) that forward a fixed set of arguments
# and drop everything else. The sensor kit therefore reads
# `$(env IMU_SOURCE xsens)` / `$(env CAMERA_MODEL gscam)`, and the environment is
# the only channel that survives the trip. Passing `imu_source:=zed` on the
# command line looks like it works and does nothing.
#
# Every key keeps an already-set value, so a one-off override still wins:
#     IMU_SOURCE=xsens just launch

# Which IMU feeds Autoware: xsens | zed
#
# zed - the ZED X's built-in IMU, published by the ZED node on the orin at
#       /sensing/camera/zed/imu/data and consumed by imu_corrector on the master
#       over DDS. No driver is launched for it here.
#
# This is `zed` because the Xsens MTi is currently BROKEN: it publishes nothing.
# Its topics are deliberately still in config/recording/master_topics.txt and will
# record zero messages - an empty topic in the bag is evidence the device was
# expected and silent, which is more useful than its absence.
#
# Switch back to xsens once the device is repaired; the corrector parameters for
# both live in individual_params as imu_corrector_<source>.param.yaml and do not
# transfer between devices.
IMU_SOURCE="${IMU_SOURCE:-zed}"

# Which camera driver the sensor kit launches: gscam | zedx | none
#
# Left at the default. The orin's ZED X is launched separately, out of the
# is_orin group in golfcart.launch.yaml, not through this path.
CAMERA_MODEL="${CAMERA_MODEL:-gscam}"

# Which host runs the LiDAR drivers (Velodyne VLP-32C via nebula, Seyond
# Falcon): master | orin
#
# master - unchanged behaviour: both drivers run here, where the sensors are
#          physically cabled today (enP5p4s0, enP5p5s0 - see
#          docs/multi-machine.md and net_monitor_master.param.yaml).
# orin   - the drivers run on the orin instead. Point cloud preprocessing and
#          concatenation stay on the master either way; only the raw drivers
#          move, and the master consumes their output over DDS.
#
# BEFORE setting this to orin: the master<->orin link is a shared 100 Mb/s
# LAN, and one raw LiDAR is already ~30 MB/s (~240 Mb/s for both) - it cannot
# fit. This is a placement knob for when the sensors are physically recabled
# to the orin over a link that can carry them (the unused 1 Gb/s interlink,
# scripts/hardware/network/setup-interlink.sh), not something to flip today.
# See docs/roadmaps/8-lidar-on-orin.md for the full bandwidth accounting and
# what else has to move (network profiles, PTP) before this is real.
LIDAR_HOST="${LIDAR_HOST:-master}"

# Which GNSS receiver this host launches: ublox | septentrio | none
#
# `none` on the host that does not have the receiver cabled to it. The u-blox is
# on the orin, because the oToCam overlay took the Advantech's USB ports, but
# both hosts launched ublox_gps_node. On the Advantech it dies on a missing
# /dev/ublox-gps and respawns every second forever, and each restart collides
# with the name the orin's node holds: 1131 `Duplicated nodes detected
# [/sensing/gnss/ublox]` reports in the 2026-08-25 run.
#
# Left at ublox here because config/sensors.conf is shared. Set
# GNSS_RECEIVER=none on the Advantech, or gate it on config/host once someone
# confirms which host is which in a live run.
GNSS_RECEIVER="${GNSS_RECEIVER:-ublox}"
