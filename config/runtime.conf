# runtime.conf - play_launch runtime switches that must survive into systemd units.
#
# Sourced by scripts/env.sh, so shells and units agree. Like sensors.conf and
# vehicle.conf, every key keeps an already-set value, so a one-off override wins:
#
#     GOLFCART_CONTAINER_MODE=isolated just launch

# How play_launch runs composable nodes: observable | isolated | stock
#
#   observable  every composable node is LOADED INTO its container process, and
#               the container publishes ComponentEvents so the web UI still
#               lists each node. One OS process and one DDS participant per
#               container.
#   isolated    play_launch clone(CLONE_VM)s every composable node into its own
#               process. One DDS participant PER NODE.
#   stock       use the container executable named in the launch file, with no
#               play_launch override. Also one participant per container, but
#               without ComponentEvent publishing.
#
# Default observable, not play_launch's own default of isolated, because
# isolated is what makes this stack unusable on the Advantech. Measured with
# `just profile report` and `just profile perf` while the full stack was up:
#
#   isolated    84 composable nodes ran as 84 extra processes -> 149 DDS
#               participants -> 148 x 7 = 1036 CycloneDDS threads, 3739 threads
#               total on 12 cores, loadavg 276. Cyclone's own threads
#               (tev/recv/recvMC/recvUC/gc/dq.*) accounted for ~76% of all CPU
#               samples; Autoware's actual work was under 10%. Discovery,
#               heartbeat and liveliness traffic is O(N^2) in participant count,
#               so 205k loopback packets/s at 214 B average, 529k UDP datagrams
#               delivered per second, and 1308 socket-buffer drops/s - each drop
#               costing a NACK and a retransmit scheduled by tev, the single
#               hottest thread.
#
# What isolated buys, and what switching costs: a node that segfaults under
# isolated takes down only itself, and play_launch can name it. Under
# observable it takes its whole container with it, so a crash names ~6 nodes
# instead of 1. That is the trade. Set this to isolated for the run in which you
# are chasing such a crash, then set it back:
#
#     GOLFCART_CONTAINER_MODE=isolated just launch
#
# play_launch 0.9.0 has no PER-CONTAINER setting - `--container-mode` is global
# and RuntimeConfig (-c/--config) has no equivalent key - so isolating one
# suspect container alone is not expressible today.
GOLFCART_CONTAINER_MODE="${GOLFCART_CONTAINER_MODE:-observable}"

case "${GOLFCART_CONTAINER_MODE}" in
    observable | isolated | stock) ;;
    *)
        echo "WARNING: GOLFCART_CONTAINER_MODE='${GOLFCART_CONTAINER_MODE}' is not one of" \
             "observable|isolated|stock; using observable." >&2
        GOLFCART_CONTAINER_MODE=observable
        ;;
esac

# ── Middleware ───────────────────────────────────────────────────────────────
#
# Which RMW every ROS process on this host uses: cyclonedds | zenoh
#
#   cyclonedds  rmw_cyclonedds_cpp with config/cyclonedds/<role>.xml. The
#               deployed default, and what every measurement in docs/research/
#               was taken against.
#   zenoh       rmw_zenoh_cpp with config/zenoh/<role>-session.json5, plus an
#               rmw_zenohd router process per host. See config/zenoh/README.md.
#
# This is a per-HOST setting and both machines must agree: the two RMWs share no
# wire protocol, so a master on zenoh and an orin on cyclonedds do not fail —
# they come up cleanly and simply never see each other's topics. `just service
# host-status` prints the effective value on both.
#
# Why zenoh is being tried at all: with GOLFCART_CONTAINER_MODE=isolated the
# CycloneDDS discovery load measured at ~76% of all CPU samples across 149
# participants (see the note above, and docs/research/system/where-the-orin-cpu-
# goes.md). That cost is O(N^2) in participant count and is paid in Cyclone's own
# threads, not in Autoware's work. Zenoh moves discovery to a router and carries
# data over TCP, so the shape of that curve should be different. "Should be" —
# nothing here is measured yet.
#
# Switching this is NOT enough on its own: the ROS 2 daemon binds its RMW when
# it starts and keeps it for its lifetime, so a daemon left over from the other
# setting makes `ros2 topic list` and friends report an empty graph while the
# stack is running perfectly. scripts/rmw/ensure.sh stops a mismatched daemon and
# every launch path calls it; `just rmw status` shows the current state.
# Default zenoh ON THIS BRANCH. `rmw-zenoh` exists to run the stack on Zenoh, and
# a branch whose whole purpose is that experiment should not need an extra manual
# step before every launch. On `main` this is cyclonedds, and it stays that way
# until there are measurements to justify moving it.
GOLFCART_RMW="${GOLFCART_RMW:-zenoh}"

case "${GOLFCART_RMW}" in
    cyclonedds | zenoh) ;;
    *)
        echo "WARNING: GOLFCART_RMW='${GOLFCART_RMW}' is not one of" \
             "cyclonedds|zenoh; using cyclonedds." >&2
        GOLFCART_RMW=cyclonedds
        ;;
esac
