# versions.yaml - the versions this project is built on, and the catalogue of
# Autoware releases it supports.
#
# Readers:
#   setup/golfcart_setup/autoware.py   the catalogue (stdlib parser: keep this
#                                      file to nested mappings of scalars,
#                                      two-space indent, no lists or anchors)
#   setup/scripts/install-autoware-debian.sh, through autoware.py
#   scripts/version/get-version.sh     any scalar by dotted key
#
# Which Autoware a host runs is NOT decided here. scripts/autoware_version.sh
# resolves it: GOLFCART_AUTOWARE_VERSION, then config/autoware-version
# (gitignored, per host), then the default in config/runtime.conf. This file
# only says what each supported version is and where its packages come from.

golfcart:
  version: "0.1.0-dev"

ros:
  distro: "humble"
  installation_type: "desktop"  # desktop, ros-base
  rmw_implementation: "rmw_cyclonedds_cpp"

# One entry per supported Autoware version, keyed X.Y.Z.
#
#   release   the NEWSLabNTU/autoware-localrepo GitHub release tag. From
#             1.5.0-humble-4 the tag names the ROS distro and the deb's
#             Debian version leaves it out (1.5.0-4ubuntu2204); older tags
#             (2.1.0-1) are the revision as they stand
#   suffix    the apt package suffix: autoware-full-<suffix>,
#             autoware-localrepo-<suffix>, /usr/bin/*-<suffix>
#   platforms one deb per platform this project installs on:
#               ubuntu2204  x86_64 workstations and laptops (CUDA)
#               jetpack62   both AGX Orins (JetPack 6.2, L4T r36.4)
#             sha256 is GitHub's digest for the release asset:
#               gh release view <release> -R NEWSLabNTU/autoware-localrepo \
#                 --json assets --jq '.assets[] | "\(.name) \(.digest)"'
#
# Both hosts of the cart must run the same version: DiagNodeStatus, which
# crosses the master/orin link, changed between 1.5.0 and 2.1.0.
#
# 1.5.0-1 is not listed and not supported: it installs unsuffixed files
# (/usr/bin/apply-autoware-theme, 10-cyclone-max.conf, multicast-lo.service)
# that collide with any second version. 1.5.0-3 and later suffix them.
# 1.5.0-3 is broken (diagnostic_updater links missing, CUDA runtime not
# installed); 1.5.0-humble-4 fixes both.
# 2.1.0's Jazzy release (2.1.0-jazzy-1) is not for this project, which stays
# on Humble.
autoware:
  "1.5.0":
    release: "1.5.0-humble-4"
    suffix: "1-5-0"
    universe: "0.48.0"
    platforms:
      ubuntu2204:
        deb: "autoware-localrepo-1-5-0_1.5.0-4ubuntu2204_all.deb"
        sha256: "a6ad95d19f6a886cef8405911ef6d63ccf58245b3b53b9931312c925504253eb"
      jetpack62:
        deb: "autoware-localrepo-1-5-0_1.5.0-4jetpack62_all.deb"
        sha256: "ecfe50370a7612322e9f3f617617d6cf2d8826fa4a9e660f0ecf285ef8838fe4"
  "2.1.0":
    release: "2.1.0-1"
    suffix: "2-1-0"
    universe: "0.53.2"
    platforms:
      ubuntu2204:
        deb: "autoware-localrepo-2-1-0_2.1.0-1ubuntu2204_all.deb"
        sha256: "55db8d65917f6adc726a22f05c6f29f96c42030da00bbfd2e1d7e2e5ef7624b0"
      jetpack62:
        deb: "autoware-localrepo-2-1-0_2.1.0-1jetpack62_all.deb"
        sha256: "ff095309e3662016d206d11cf90526e51fabc6ca68dc48c79842813a3ef2f902"
