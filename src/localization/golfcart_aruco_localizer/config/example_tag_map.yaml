# Example ArUco tag map.
#
# This is DATA, not configuration: the poses are measured by hand and supplied
# to the system. It is not produced by the vehicle and it is not derived from
# any other map.
#
# The real map for a site lives beside that site's vector map, e.g.
#   data/<site>/aruco_tag_map.yaml
# This file exists so the node can be launched and eyeballed in RViz without a
# survey, and as the schema reference.

frame_id: map

survey:
  date: "2026-08-10"
  method: "EXAMPLE DATA -- not a real survey"
  # 1-sigma position uncertainty of the surveyed board poses, in metres.
  #
  # This number is the ceiling on the accuracy of the whole localization system.
  # No amount of vision quality recovers from a poorly measured map: the vision
  # error and this error add in quadrature, so a 10 cm survey makes a 3 cm
  # vision solution almost irrelevant. It is worth measuring carefully once.
  stated_accuracy: 0.02

defaults:
  dictionary: DICT_5X5_1000
  # Edge length of the black MARKER square, not the board it is printed on.
  # For an LCTK 1x1 board at the shipped defaults (500 mm board, 10 mm border,
  # 0.8 marker-to-square ratio) this is (500 - 2*10) * 0.8 = 384 mm.
  # An error here scales every range estimate linearly.
  marker_size: 0.384

tags:
  # ── pose form ──────────────────────────────────────────────────────────────
  # Position plus a quaternion. Convenient when the pose is generated by a tool,
  # but note it requires committing to the tag frame convention: origin at the
  # marker centre, x right, y up, z out of the printed face toward a viewer.
  - id: 696
    position: {x: 0.0, y: 4.0, z: 1.50}
    orientation: {x: 0.5, y: -0.5, z: -0.5, w: 0.5}   # faces -y, i.e. into the room

  - id: 64
    position: {x: 6.0, y: 4.0, z: 1.50}
    orientation: {x: 0.5, y: -0.5, z: -0.5, w: 0.5}

  # ── corner form ────────────────────────────────────────────────────────────
  # Four measured corner points, in OpenCV order as seen by a viewer facing the
  # marker: top-left, top-right, bottom-right, bottom-left.
  #
  # PREFER THIS FOR A HAND SURVEY. Four measured points fix position,
  # orientation and size at once, with no frame convention for a human to get
  # wrong -- where writing a quaternion by hand means deciding what the board's
  # local axes mean and being right about it.
  #
  # These describe a 384 mm marker on the far wall, facing back down the room.
  - id: 306
    corners:
      - [3.192, 9.000, 1.692]
      - [2.808, 9.000, 1.692]
      - [2.808, 9.000, 1.308]
      - [3.192, 9.000, 1.308]

  # Boards on a different wall, so their normals are spread. Five coplanar
  # boards at one depth are worth far less than three on different walls: the
  # unobservable direction of the solve is a rotation about the centroid of
  # whatever is visible, and only differing normals constrain it.
  - id: 195
    position: {x: 9.0, y: 2.0, z: 1.50}
    orientation: {x: 0.5, y: -0.5, z: 0.5, w: -0.5}   # faces -x
    # A more carefully measured anchor board. Per-tag uncertainty overrides the
    # survey default and becomes this board's weight in the solve, so a
    # well-measured board legitimately outweighs a roughly placed one.
    position_stddev: 0.005
