[package]
name = "golfcart_aruco_detector"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "golfcart_aruco_detector"
path = "src/main.rs"

[lib]
name = "golfcart_aruco_detector"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
log = "0.4"
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }

# ROS 2 dependencies (resolved via ament_index by colcon-cargo-ros2)
rclrs = "*"
std_msgs = "*"
sensor_msgs = "*"
geometry_msgs = "*"
aruco_detection_msgs = "*"

# Pinned to a commit, not a branch and not a path.
#
# Not a version: colcon-cargo-ros2 generates [patch.crates-io] entries only for
# *interface* packages, from their generated bindings, so a plain Rust library
# gets no patch and `"*"` would resolve against the real crates.io and fail on a
# name that is not there.
#
# Not a branch either. `rev` is what makes a build reproducible: a branch would
# let the crate this node links change under a `cargo update` with nothing in
# this repository recording that it did. Bumping it is an edit here, which is
# the point.
#
# The transitive rclrs and sensor_msgs requirements inside that crate are still
# redirected by the generated [patch.crates-io], because patches apply to the
# whole dependency graph rather than only to direct dependencies.
#
# Needs network on the first build of a given rev; cargo caches it under
# ~/.cargo/git afterwards.
rclrs_image_transport = { git = "https://github.com/jerry73204/rclrs_image_transport.git", rev = "52983a71b2b80904e1cad52c0ab459c7949b6156" }

[dependencies.opencv]
version = "0.88.9"
default-features = false
# aruco: detectMarkers and the predefined dictionaries.
# calib3d: undistortPoints, solvePnP*, Rodrigues.
# imgproc: rectification, overlay drawing, and `remap` in the round-trip test.
#
# imgcodecs is deliberately gone: decoding moved to rclrs_image_transport,
# which decodes JPEG through libjpeg-turbo and, unlike `imdecode`, knows what
# CompressedImage.format means.
features = ["aruco", "calib3d", "imgproc", "clang-runtime"]
