# Bench map for the simulation smoke test. NOT a survey.
#
# An L: one arm along +x at y = 0, a second along +y at x = 14, joined by the
# turn the `corridor` trajectory drives. Boards sit on both walls of each arm at
# MATCHING positions, in facing pairs, every 3 m.
#
# The pairing is the whole design, and it is worth understanding before copying
# this layout to a real site.
#
# A board flat on a wall is only usable over a narrow band of the drive. Viewing
# angle is acos(wall_offset / range), so with a 3 m offset:
#
#     distance ahead   0 m    1 m    3 m    5 m    7 m    9 m
#     view angle       0 deg  18     45     59     66     72
#
# Below min_view_angle_deg (25) the pose is fronto-parallel and its orientation
# is untrustworthy; above max_view_angle_deg (75) detection itself fails; and
# initialization is stricter still at 50 deg. So a single wall board is only
# init-eligible while it is roughly 2-4 m away -- a window about 2 m long.
#
# Two boards must satisfy that at the SAME MOMENT, with different normals, or
# the system never initializes. Boards staggered along one wall never do: each
# enters and leaves the window alone. Facing pairs at equal offset enter it
# together and have opposite normals, which is also the maximum possible spread.
#
# This replaced a staggered layout that looked reasonable and could not
# cold-start: the localizer reported "1 of 1 boards within 8.0 m and 50 deg
# (need 2), spread 0.0 deg" for an entire run.
#
# The second arm exists because the `corridor` trajectory turns out of the first
# one. Without it the vehicle drove into unmapped space and diverged -- correct
# behaviour against a map that stopped, but it tested the fixture rather than
# the localizer.
#
# The four boards at the corner (ids 103, 203, 113, 213) close a coverage hole
# that only appeared once the rest worked: arm A's boards ended at x = 9 and arm
# B's began at y = 6, so the entire turn was unseen. The vehicle stayed DEGRADED
# through it -- fixes from one board, no heading correction -- and along-track
# error reached 2.9 m before the next pair came into view, against 1.5 cm
# everywhere else.
#
# That is the single most transferable lesson here for the real site: straights
# look after themselves, and CORNERS ARE WHERE COVERAGE FAILS. A board layout
# planned by walking the straights will have exactly this hole.
frame_id: map

survey:
  date: "2026-08-12"
  method: "SYNTHETIC BENCH FIXTURE -- not a real survey"
  stated_accuracy: 0.02

defaults:
  dictionary: DICT_5X5_1000
  marker_size: 0.384

