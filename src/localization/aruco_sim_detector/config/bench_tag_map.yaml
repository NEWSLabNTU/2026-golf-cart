# Bench map for the simulation smoke test. NOT a survey.
#
# Chosen so the DEFAULT bench run is a healthy one. Boards sit on four walls of
# a 14 x 6 m room with their normals spread across all four directions, and the
# straight trajectory (x 0 -> 10 along y=0) keeps at least two boards with
# DIFFERENT normals inside both the 8 m range gate and the 25-75 deg view window
# for its whole length.
#
# That spread is a correctness requirement, not a quality nicety. Coplanar
# boards flip TOGETHER, so their wrong solutions corroborate each other exactly
# as well as their right ones do and no amount of agreement separates them.
# example_tag_map.yaml demonstrates the file format and happens to put three of
# its four boards on one wall; running the bench against it produces flip ties
# and ill-conditioned solves, which is the design working, not the design
# failing. Use that map to exercise the degenerate path on purpose.
frame_id: map

survey:
  date: "2026-08-11"
  method: "SYNTHETIC BENCH FIXTURE -- not a real survey"
  stated_accuracy: 0.02

defaults:
  dictionary: DICT_5X5_1000
  marker_size: 0.384

tags:
  - id: 100
    # left wall, faces -y, centre (1.0, 3.0, 1.5)
    corners:
      - [0.808, 3.000, 1.692]
      - [1.192, 3.000, 1.692]
      - [1.192, 3.000, 1.308]
      - [0.808, 3.000, 1.308]
  - id: 101
    # left wall, faces -y, centre (5.0, 3.0, 1.5)
    corners:
      - [4.808, 3.000, 1.692]
      - [5.192, 3.000, 1.692]
      - [5.192, 3.000, 1.308]
      - [4.808, 3.000, 1.308]
  - id: 102
    # left wall, faces -y, centre (9.0, 3.0, 1.5)
    corners:
      - [8.808, 3.000, 1.692]
      - [9.192, 3.000, 1.692]
      - [9.192, 3.000, 1.308]
      - [8.808, 3.000, 1.308]
  - id: 200
    # right wall, faces +y, centre (3.0, -3.0, 1.5)
    corners:
