/**:
  ros__parameters:
    # Path to the same tag map the localizer reads. One source of truth: if the
    # simulator had its own copy, a divergence between them would look like a
    # localizer bug.
    tag_map_path: ""

    # Corner noise, 1-sigma pixels. Set to 0.0 for the zero-noise round trip
    # that checks the geometry chain; set to a realistic value to exercise the
    # covariance model.
    corner_sigma_px: 0.3

    max_range: 13.0
    # Detection limit only. Boards nearer their normal than the ambiguity cone
    # are still detected — emitting them is the point, since resolving the
    # ambiguity is the localizer's job.
    max_detect_angle_deg: 82.0
    min_marker_px: 20.0

    # Deterministic by default. A fixture whose output changes run to run
    # cannot be used to bisect a regression.
    seed: 42

    camera_names: ["left", "right", "rear"]

    cameras:
      left:
        optical_frame: camera_left_optical
        fx: 900.0
        fy: 900.0
        cx: 960.0
        cy: 640.0
        width: 1920
        height: 1280
        xyz: [0.0, 0.4, 0.6]
        # Optical frame in base_link: z forward, x right, y down, then yawed to
        # where the camera actually points. The vehicle URDF is currently
        # missing exactly this rotation.
        #
        # These yaws used to disagree with the names -- "left" pointed straight
        # ahead and "right" pointed backwards -- so nothing ever looked at the
        # right-hand wall. Every solve then drew its boards from one wall, the
        # normal spread was 0, and the system could not initialize or resolve
        # heading no matter how the board map was arranged.
        rpy: [-1.5707963, 0.0, 1.5707963]   # +90 deg: looks left (+y)
        stamp_offset: 0.0
      right:
        optical_frame: camera_right_optical
        fx: 900.0
        fy: 900.0
        cx: 960.0
        cy: 640.0
        width: 1920
        height: 1280
        xyz: [0.0, -0.4, 0.6]
        rpy: [-1.5707963, 0.0, -1.5707963]  # -90 deg: looks right (-y)
        stamp_offset: 0.011
      rear:
        optical_frame: camera_rear_optical
        fx: 900.0
        fy: 900.0
        cx: 960.0
        cy: 640.0
        width: 1920
        height: 1280
        xyz: [-0.5, 0.0, 0.6]
        rpy: [-1.5707963, 0.0, 3.1415927]   # 180 deg: looks behind (-x)
        stamp_offset: 0.022

    fault:
      # Emit nothing at all. Drives the localizer to DEAD_RECKONING and, once
      # the budget expires, to FAULT and an MRM stop.
      blackout: false

      # Move one board away from where the map says it is. The integrity
      # monitor must flag this ID and no other.
      displaced_board_id: -1
      displacement: [0.0, 0.0, 0.0]

      # Restrict which boards may be seen. One board exercises the DEGRADED
      # path; several boards on one wall exercise the coplanar flip tie, where
      # the correct answer is to publish nothing.
      # NOTE: left commented out on purpose. An empty YAML list has no
      # inferrable element type, so ROS 2 overrides the declared default with an
      # untyped empty value and the node dies at startup with
      # "parameter_value_from failed". Omit the key to mean "all boards";
      # uncomment with real ids to restrict.
      # visible_board_ids: [10, 11]

      # Push every stamp into the future, to check the clock-skew rejection.
      stamp_offset_s: 0.0
