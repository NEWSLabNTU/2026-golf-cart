# Concatenate node parameters for sample_bag_sensor_kit (3 lidars: top, left, right)
# Based on sample_sensor_kit_launch config, adapted for rosbag replay without rear lidar
/**:
  ros__parameters:
    debug_mode: false
    rosbag_length: 10.0
    maximum_queue_size: 5
    timeout_sec: 0.2
    is_motion_compensated: true
    publish_synchronized_pointcloud: true
    keep_input_frame_in_synchronized_pointcloud: true
    publish_previous_but_late_pointcloud: false
    synchronized_pointcloud_postfix: pointcloud
    input_twist_topic_type: twist
    # Only 3 lidars (no rear) - matches the sample rosbag data
    input_topics: [
                    "/sensing/lidar/top/pointcloud_before_sync",
                    "/sensing/lidar/left/pointcloud_before_sync",
                    "/sensing/lidar/right/pointcloud_before_sync",
                ]
    output_frame: base_link
    matching_strategy:
      type: advanced
      lidar_timestamp_offsets: [0.0, 0.0, 0.0]
      # Widened from 0.01 on 2026-08-27. At 0.01 the observed matching window was
      # 20 ms, and the VLS128 top LiDAR (~191k points, the slowest to preprocess)
      # made it into only 14% of windows on CPU and 15% on CUDA. That ceiling sat
      # above both backends and hid what they actually cost.
      # 0.1 matches golfcart_sensor_kit_launch.
      lidar_timestamp_noise_window: [0.1, 0.1, 0.1]
