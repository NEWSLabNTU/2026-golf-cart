# Upstream's localization.yaml (autoware_launch, Autoware 1.5.0), copied for
# ONE change: the timeout on /autoware/localization/state. Loaded through
# autoware-main.yaml beside it; see that file's header for why.
#
# This replaces a December 2025 snapshot of the same name that nothing ever
# loaded (c98a492, kept through 4717a34). Its one edit, removing the
# /autoware/localization/accuracy link from the gate, was therefore never in
# effect, and it is NOT carried over here: the accuracy check gates exactly as
# it has on every run so far. Whether to drop it is Phase 8 L1's decision, to be
# made from measured ellipse sizes, not as a side effect of this copy. See
# docs/guides/mrm_configuration.md, "Change 1".
units:
  - path: /autoware/localization
    type: and
    list:
      - type: link
        link: /autoware/localization/state
      - type: and
        list:
          - { type: link, link: /autoware/localization/topic_rate_check/transform }
          - { type: link, link: /autoware/localization/topic_rate_check/pose_twist_fusion }
          - { type: link, link: /autoware/localization/scan_matching_status }
          - { type: link, link: /autoware/localization/accuracy }
          - { type: link, link: /autoware/localization/sensor_fusion_status }

  - path: /autoware/localization/state
    type: diag
    node: /adapi/node/localization
    name: state
    # Golf cart: published at 1 Hz; with the 1.0 s default it went STALE for
    # 0.1 s every 1-3 s in replays and each blip made /autoware/localization
    # ERROR (Phase 8 L6). 3.0 s, as upstream's CARLA graph and AutoSDV 8d585112.
    timeout: 3.0

  - path: /autoware/localization/topic_rate_check/transform
    type: diag
    node: topic_state_monitor_transform_map_to_base_link
    name: localization_topic_status

  - path: /autoware/localization/topic_rate_check/pose_twist_fusion
    type: diag
    node: topic_state_monitor_pose_twist_fusion_filter_pose
    name: localization_topic_status

  - path: /autoware/localization/scan_matching_status
    type: diag
    node: ndt_scan_matcher
    name: scan_matching_status

  - path: /autoware/localization/accuracy
    type: diag
    node: localization_error_monitor
    name: ellipse_error_status

  - path: /autoware/localization/sensor_fusion_status
    type: diag
    node: localization
    name: ekf_localizer
