# NOT LOADED BY ANYTHING. Kept because the edit below is real work.
#
# The aggregator's graph path is `autoware-main.yaml` from autoware_launch on
# every path except `pose_source:=aruco`, which loads `autoware-main-aruco.yaml`
# from this directory. That file pulls its localization subtree from
# `localization-aruco.yaml`, its sibling, and every other subtree from
# autoware_launch. Nothing reaches this file.
#
# It survived the 2026-08-21 sweep that removed 145 config files inherited
# verbatim from the 2025-12-28 bulk copy of autoware_launch/config and never
# touched since. This one WAS touched: the accuracy-check link below was
# deliberately removed. Deleting it would have discarded that decision, so it
# stays until someone confirms the same change is or is not wanted in
# `localization-aruco.yaml`, which is the file that actually runs.
#
# Do not wire this in without re-reading it against upstream first. It is a
# December snapshot, and upstream's localization.yaml has moved since.

units:
  - path: /autoware/localization
    type: short-circuit-and
    list:
      - type: link
        link: /autoware/localization/state
      - type: and
        list:
          - { type: link, link: /autoware/localization/topic_rate_check/transform }
          - { type: link, link: /autoware/localization/topic_rate_check/pose_twist_fusion }
          - { type: link, link: /autoware/localization/scan_matching_status }
          # Golf Cart: Disabled accuracy check to prevent false MRM emergency stops
          # The error ellipse thresholds (1.5m/0.3m) are too strict for VLP-32C
          # Localization quality is still monitored via scan_matching_status
          # - { type: link, link: /autoware/localization/accuracy }
          - { type: link, link: /autoware/localization/sensor_fusion_status }

  - path: /autoware/localization/state
    type: diag
    node: component_state_diagnostics
    name: localization_state

  - path: /autoware/localization/topic_rate_check/transform
    type: diag
    node: topic_state_monitor_transform_map_to_base_link
    name: localization_topic_status

  - path: /autoware/localization/topic_rate_check/pose_twist_fusion
    type: diag
    node: topic_state_monitor_pose_twist_fusion_filter_pose
    name: localization_topic_status

  - path: /autoware/localization/scan_matching_status
    type: diag
    node: ndt_scan_matcher
    name: scan_matching_status

  - path: /autoware/localization/accuracy
    type: diag
    node: localization_error_monitor
    name: ellipse_error_status

  - path: /autoware/localization/sensor_fusion_status
    type: diag
    node: localization
    name: ekf_localizer
