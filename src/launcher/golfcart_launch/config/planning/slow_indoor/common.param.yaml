# Copy of autoware_planning_config 2.1.0 config/scenario_planning/common/common.param.yaml, for the
# slow_indoor planning preset (rebased from the 1.5.0 copy 2026-11-17).
# Changed values carry a "golfcart:" comment; everything else must stay
# upstream (test_planning_preset.py compares every leaf). Any sync-params
# header below is upstream's, kept as it is.
# This file is managed by sync-params workflow.
# DO NOT EDIT THIS FILE DIRECTLY FOR ADDING OR REMOVING FIELDS. Follow these steps:
#
# 1. Modify the param file in the upstream repository.
# 2. Run the sync-params workflow or run `python .github/scripts/sync_params.py planning` to update this file.
# 3. If local changes are needed, annotate them with an override marker (see below).
#
# Keys marked with '{OVERRIDE}' or '# {OVERRIDE: reason}' are persisted as variant overrides.
# 'reason' can be any single-line text without braces.
# To keep local changes, annotate fields with '# {OVERRIDE}' or '# {OVERRIDE: reason}'.
#
# Source: https://github.com/autowarefoundation/autoware_core/blob/cef72e02f92cf21333231db9b247b7d4c85a944d/planning/autoware_core_planning/config/common.param.yaml

/**:
  ros__parameters:
    # golfcart: 4.17 -> 2.5, the vehicle interface's max_speed_mps. Above it
    # the interface clamps the command and the controller tracks a speed
    # profile the cart will not follow. A ceiling; planning_speed_limit is the
    # startup default under it.
    max_vel: 2.5            # max velocity limit [m/s]

    # constraints param for normal driving
    normal:
      min_acc: -1.0         # min deceleration [m/ss]
      max_acc: 1.0          # max acceleration [m/ss]
      min_jerk: -1.0        # min jerk [m/sss]
      max_jerk: 1.0         # max jerk [m/sss]

    # constraints to be observed
    limit:
      min_acc: -2.5         # min deceleration limit [m/ss]
      max_acc: 1.0          # max acceleration limit [m/ss]
      min_jerk: -1.5        # min jerk limit [m/sss]
      max_jerk: 1.5         # max jerk limit [m/sss]
