# Stock Autoware planning: adds nothing.
#
# Exists because our tier4_planning_component.launch.xml resolves
# module_preset here, and "default" must keep meaning what it means upstream.
# Upstream's planning.launch.xml (2.1.0) includes
# autoware_planning_config/config/preset/default_preset.yaml itself, after
# this file, so every module default comes from there. The parameter files
# stay upstream's too: the golfcart_*_param_path arguments default to them.
#
# On 1.5.0 this file included autoware_launch's default preset, because our
# copy of the planning component replaced upstream's preset include.
launch: []
