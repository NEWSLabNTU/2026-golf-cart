launch:
  # LiDAR-Only Perception Preset
  # Default preset for Golf Cart
  # Uses only LiDAR for perception, disables camera-based features

  # Perception mode - LiDAR only
  - arg:
      name: perception_mode
      default: "lidar"

  # Feature toggles - Disabled for LiDAR-only mode
  - arg:
      name: use_traffic_light_recognition
      default: "false"

  - arg:
      name: use_detection_by_tracker
      default: "false"

  - arg:
      name: use_image_segmentation_based_filter
      default: "false"

  # Map usage
  - arg:
      name: use_pointcloud_map
      default: "true"

  # Detection: CenterPoint tiny plus the clustering detector. On Autoware
  # 2.1.0 the tracker reads clustering as its own channel (lidar_clustering),
  # objects of class unknown: whatever CenterPoint has no class for, a box or a
  # trolley in the aisle. On, by decision of 2026-11-17. On 1.5.0 the tracker
  # ignored it in lidar mode and this was off; use_lidar_rule_detector:=false
  # (our copy of the perception launch) is still there to drop it.
  - arg:
      name: lidar_detection_model
      default: "centerpoint/centerpoint_tiny"

  - arg:
      name: use_lidar_rule_detector
      default: "true"

  # Statistics publisher, nothing consumes it
  - arg:
      name: use_perception_analytics_publisher
      default: "false"
