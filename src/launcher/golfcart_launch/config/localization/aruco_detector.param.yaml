/**:
  ros__parameters:
    # ─────────────────────────────────────────────────────────────────────────
    # The printed marker
    # ─────────────────────────────────────────────────────────────────────────
    dictionary: "DICT_5X5_1000"

    # Side of the BLACK SQUARE, in metres -- not the size of the printed board.
    # The board carries a white quiet zone which is not part of the marker.
    # Getting this wrong scales every reported range linearly, and presents as a
    # calibration error rather than as the typo it is.
    marker_size: 0.384

    border_bits: 1

    # ─────────────────────────────────────────────────────────────────────────
    # Corner localization
    # ─────────────────────────────────────────────────────────────────────────
    # Corner error is the direct input noise of the pose solve, and with four
    # corners per marker there is no redundancy to average it away. OpenCV's
    # default is "none", which quantises corners to the pixel grid; "subpix"
    # measured 25-60 % better at every apparent marker size from 54 to 302 px.
    corner_refinement: "subpix"

    # Must stay well under half the spacing between two corners of one marker,
    # or adjacent corners' windows overlap and pull each other off-target.
    # Pinned by a test across 60-300 px markers.
    corner_refinement_win_size: 5
    corner_refinement_max_iterations: 30
    corner_refinement_min_accuracy: 0.01

    # ─────────────────────────────────────────────────────────────────────────
    # Detection cost
    # ─────────────────────────────────────────────────────────────────────────
    # Find candidates on an image reduced by this factor, then refine the
    # corners against the full-resolution frame. 1 disables it.
    #
    # This is the only knob that moves detection cost, and it is not close.
    # Measured on an AGX Orin, 1920x1280 with speckle, three markers:
    #
    #   downscale   detectMarkers   smallest marker still found
    #       1          38.1 ms                14 px
    #       2          11.8 ms                22 px
    #       3           6.0 ms                26 px
    #       4           4.3 ms                34 px
    #
    # Narrowing the adaptive-threshold sweep buys about 3.4 ms per scale
    # dropped, and raising min_marker_perimeter_rate or turning off corner
    # refinement buy nothing measurable: the time goes into findContours and
    # approxPolyDP over the whole frame, which is per-pixel work.
    #
    # Corner precision is NOT what this trades. Corners come back from the
    # reduced pass and are then refined against the full-resolution image, which
    # was measured at 0.002 px RMSE against full-resolution detection. What it
    # trades is the smallest marker that can still be found at all.
    #
    # Left at 1 until it is measured on a recorded bag. The numbers above come
    # from a synthetic scene, and the floor that matters is the one real
    # cameras and real boards produce.
    detection_downscale: 1

    # Decode the JPEG at a fraction of its stored size, 1 | 2 | 4 | 8. libjpeg
    # does this inside the IDCT, so it is cheaper than decoding and resizing.
    #
    # A DIFFERENT trade from detection_downscale, and worth keeping straight.
    # This one throws pixels away before anything sees them, so corner precision
    # really is reduced. detection_downscale keeps the full frame for the
    # refinement and only searches a reduced one, which is why it measures at
    # 0.002 px. Reach for detection_downscale first.
    #
    # Measured live on an AGX Orin: one 1920x1280 camera at 30 fps, gscam with
    # hardware NVJPG, whole-node CPU:
    #
    #   decode  downscale     rate      CPU
    #     1         1        30.0 Hz    187%
    #     1         2        29.7 Hz     76%
    #     2         1        29.9 Hz     57%
    #     2         2        30.1 Hz     53%
    #
    # Note the last two rows: once the frame is 960x640 the detection is already
    # cheap, so downscaling on top of it adds little.
    #
    # The intrinsics are scaled to match, in the node, on every CameraInfo. They
    # have to be: `k` says how a metre at a distance maps to pixels, and halving
    # the pixels while leaving fx alone reports every pose at half its true
    # distance, confidently. The detections message carries the scaled `k` and
    # the reduced width and height, so the localizer stays consistent with it.
    #
    # Only applies to the compressed transport. With image_transport:=raw the
    # node refuses to start rather than scale intrinsics for a reduction that
    # never happened.
    image_decode_scale: 1

    # ─────────────────────────────────────────────────────────────────────────
    # Candidate search
    # ─────────────────────────────────────────────────────────────────────────
    adaptive_thresh_win_size_min: 13
    adaptive_thresh_win_size_max: 33
    adaptive_thresh_win_size_step: 10

    # OpenCV's defaults here are tuned for markers filling a good part of the
    # frame. An indoor localization scene is the opposite -- small markers, far
    # away, several per image -- and the defaults reject exactly those.
    # OpenCV's min is 0.03, which discards anything below roughly 14 px per side
    # on a 1920-wide image.
    min_marker_perimeter_rate: 0.01
    max_marker_perimeter_rate: 4.0

    # Fraction of the dictionary's error-correction capacity usable when
    # decoding. Deliberately NOT raised to chase detections: a false ID gets
    # associated to a real surveyed board pose and produces a confident wrong
    # answer, which is worse than the missing observation.
    error_correction_rate: 0.6

    # Markers legitimately appear close together when several boards are seen at
    # an angle.
    min_marker_distance_rate: 0.05

    # ─────────────────────────────────────────────────────────────────────────
    # Debug
    # ─────────────────────────────────────────────────────────────────────────
    # Publishes the rectified frame. Costs a full-image warp per frame, so it is
    # off unless someone is looking.
    debug_overlay: false
