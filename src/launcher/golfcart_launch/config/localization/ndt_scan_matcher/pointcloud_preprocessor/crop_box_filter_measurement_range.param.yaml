/**:
  ros__parameters:
    input_frame: "base_link"
    output_frame: "base_link"
    # +-60 m, the Autoware default, restored after measuring against +-20 m.
    #
    # The +-20 m inherited from AutoSDV threw away most of the geometry NDT had
    # to work with: our VLP-32C returns reach ~29 m, so the box was clipping real
    # structure, and the surviving points sat in a narrow ring that constrains
    # rotation poorly. Measured on CSIE-1, stationary scan-to-map residual:
    #
    #                     p50       p95      mean    beyond 3 m
    #   +-20 m          0.210 m   1.661 m   0.476 m     0.0%
    #   +-60 m          0.145 m   0.468 m   0.185 m     0.0%
    #
    # p95 falls by 72%: the worst-fitting points are the ones that gain most,
    # which is what more distant structure is for.
    min_x: -60.0
    max_x: 60.0
    min_y: -60.0
    max_y: 60.0
    # Golf Cart: Z-axis filtering based on LiDAR mount height
    # Negative values include ground points
    # Positive values filter ground, focusing on vertical structures
    min_z: -1.0
    max_z: 50.0
    negative: False
    processing_time_threshold_sec: 0.01
