# Basement scenario, OFFLINE anchoring: the detector file for
# `anchor-map-to-board --config` against the Seyond Falcon survey cloud
# (GLIM, basement_voxel_resol_0.15.ply), not for the vehicle.
#
# This is the file data/basement-indoor/ was anchored with, verified rather
# than assumed. The survey team ran the tool from the detector repository's
# six-section config as it stood at commit 5b25426 (2026-09-10, "tune max
# height filter for the map built from seyond LiDAR"); the `detector.map`
# subsection of that file is translated here into the three-section layout.
# Reproduced 2026-09-11 with a dry run on the same cloud:
#
#   board found: 1380 points, extents 0.87 x 0.61 m, plane residual 5.8 cm
#   transform (map <- cloud), identical to board_anchor.yaml to 5 decimals:
#     0.99415  0.10794  0.00244  9.72698
#    -0.10794  0.99416 -0.00066 -4.99322
#    -0.00250  0.00040  1.00000  0.57069
#
# The previous commit, 5d313f1 (ceiling 1.5 m), does NOT reproduce it: the
# reflective band above the board merges into the cluster, which then reads
# 1.01 m tall and is rejected. The NAS copy's 17:37 timestamp is when it was
# copied, not when the tool ran.
#
# Rebuild with scripts/map/anchor_reflective_map.sh, which passes this file.
#
# Caveat, recorded rather than tuned away: with the ceiling at 1.1 m the
# 0.61 m "height" is the 0.5 to 1.1 m slab, not the board's own edges, so the
# map's z origin can carry up to about 0.2 m of bias. The VLP-32C bag puts the
# board centre 1.30 to 1.40 m above level floor, consistent to 0.1 m, and NDT
# matches the ceiling, so z is not what localization rests on. The offline
# confidence is 0.58, below the runtime gate of 0.6; the tool reports it and
# anchors anyway, which is the offline contract.

board:
  # Shared with detector.yaml beside this file: the map frame is DEFINED by
  # this pose, and the runtime guess is composed against the same one.
  pose_in_map: [0.0, 0.0, 1.3, 0.0, 0.0, 0.0]
  width: 0.6
  height: 0.6

detector:
  # The Falcon's intensity scale, not the VLP-32C's (median 16, p99 254 on
  # this cloud). 150 is what the survey ran with; the runtime 100 does not
  # transfer here and vice versa.
  intensity_threshold: 150.0
  azimuth_step_rad: 0.0035

  map:
    # The survey config's expected centre in the levelled, floor-zero frame.
    # It differs from the runtime 1.3 because the Falcon map has almost no
    # floor for the fit to find.
    board_centre_height: 1.0

    # Range and density are meaningless on a merged map; the tool turns both
    # off itself. Written out so the file reads as what was run.
    range_min: 0.0
    range_max: .inf
    density_max_ratio: 1.4
    density_check_enabled: false

    # The 1.1 m ceiling is the survey team's measured fix: it keeps the
    # reflective band above the board (z 1.7 to 1.9 in the anchored map) out of
    # the cluster. The AABB is the map point-height filter.
    aabb:
      min: [-20, -20, 0.5]
      max: [20, 20, 1.1]

    # A merged map at 0.15 m voxels is dense and regular; 0.05 is what ran.
    cluster_tolerance: 0.05
    cluster_min_points: 60
    extent_tolerance: [0.8, 1.5]
    planarity_max_thickness: 0.08
    verticality_max_dot: 0.25
    centre_height_tolerance: 0.30

covariance:
  # Unused by the anchoring tool, required by the loader. Packaged defaults.
  sigma_xy_base: 0.15
  sigma_xy_per_metre: 0.03
  sigma_z: 0.10
  sigma_yaw_base: 0.05
  sigma_roll_pitch: 0.02
  safety_factor: 2.0
  unconstrained_axis_sigma: 1.0
