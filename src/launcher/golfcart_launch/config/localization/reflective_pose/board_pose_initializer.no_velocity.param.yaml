# board_pose_initializer.param.yaml for a stack with no wheel speed: the
# logging sims, whose bags carry no /vehicle/status/velocity_status. Identical
# but for require_velocity, which would otherwise wait forever. Keep the two in
# step; test_reflective_pose_configs.py fails if they differ elsewhere.
#
# Handoff policy for board_pose_initializer on this stack: how a detected board
# pose becomes one call to Autoware's /localization/initialize. Properties of
# the vehicle stack, not of the board or the site, so this is neither per
# scenario nor part of the detector file.
#
# Every key is a field of Policy in the submodule's initializer_node.py; the
# packaged copy (reflective_pose_autoware/config/board_pose_initializer.param.yaml)
# is the reference for what the node accepts. `/**` because the node runs as
# /localization/board_pose_initializer.
/**:
  ros__parameters:
    # Autoware's pose_initializer service. With gnss_enabled false (which
    # pose_initializer:=board forces in golfcart_autoware.launch.xml) it waits
    # on this call; the align result comes back in the response and is logged.
    initialize_service: /localization/initialize

    # Speed gate on /vehicle/status/velocity_status (VelocityReport). No
    # report at all leaves the gate open, which is what lets the D1a replay
    # (a bag with no velocity in it) exercise the call.
    max_speed_for_init: 0.05          # [m/s]

    # Poses acted on before the fallback policy runs. An attempt is one pose
    # acted on, so a detector that never detects spends none.
    max_attempts: 5

    # Off, and keep it off without a reviewed fallback policy: a silent fallback
    # to a fixed pose turns a detector failure into a mislocalization report
    # three weeks later.
    fallback_to_user_defined_pose: false

    # Seconds to wait for a pose before counting an attempt as spent. Zero
    # disables it. Left disabled because the fallback above is off, so there
    # is nothing for a spent budget to trigger.
    pose_wait_timeout: 0.0

    # Phase 8 L8. A cart parked at the board through boot is detected about a
    # second after the first scan, and the map reached the matcher 8.6 s after
    # playback in the 2026-10-02 replay: five failed aligns spent the budget
    # and the initializer stopped for good. With this on, failures before the
    # matcher publishes its loaded map are retried without being counted.
    ignore_failures_before_map: true

    # Readiness (reflective_pose_detector 6431966, ported from AutoSDV): act on
    # a board pose only when Autoware's pose initializer can take one. A cold
    # start sees the board within a second or two, before the initializer has
    # stop_check_duration (3 s) of stopped twists ("The vehicle is not
    # stopped") and before NDT has a scan ("align server failed"); each refusal
    # spent an attempt, and five ran out in 7 s. A pose that arrives early is
    # ignored, not counted.
    #
    # require_velocity needs /vehicle/status/velocity_status. No bag here has
    # wheel speed, so the logging sims load
    # board_pose_initializer.no_velocity.param.yaml instead (the same file with
    # require_velocity false; test_reflective_pose_configs.py pins that).
    require_velocity: false
    # VelocityReports must have reported a stop this long, unbroken [s].
    stopped_for: 3.0
    # NDT's input cloud (the localization util chain's output).
    ready_pointcloud_topic: /localization/util/downsample/pointcloud
    # How recent the last VelocityReport / cloud must be [s].
    ready_timeout: 1.0
