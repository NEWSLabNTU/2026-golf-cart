launch:
# Multi-machine Host Profile
# master -> everything except the ZED camera (includes the Falcon LiDAR)
# orin   -> ZED camera only
# all    -> single-machine operation (default, unchanged behaviour)
- arg:
    name: host
    default: "all"
    description: "Host profile: master, orin, or all"
    choice:
    - value: "master"
    - value: "orin"
    - value: "all"

- let:
    name: is_master
    value: $(eval "'$(var host)' in ('master', 'all')")

- let:
    name: is_orin
    value: $(eval "'$(var host)' in ('orin', 'all')")

- arg:
    name: is_simulation
    default: "false"
    description: "Enable simulation mode (disables PWM output to hardware)"

# Sensor Suite Configuration
- arg:
    name: sensor_suite
    default: "vlp32c"
    description: "Predefined sensor suite: vlp32c, custom"

# Individual Sensor Parameters (override suite defaults when sensor_suite=custom)
- arg:
    name: lidar_model
    default: ""
    description: "LiDAR model (vlp32c) - empty string uses suite default"

# camera_model and imu_source default from the ENVIRONMENT, not "".
#
# Both are forwarded unconditionally to golfcart_autoware.launch.xml below. An
# empty default was survivable only by accident: the installed Autoware sensing
# files forward a fixed set of arguments and dropped these, so the sensor kit
# fell back to its own $(env ...) default and got the right answer anyway.
#
# play_launch 0.8.2's Rust parser resolves the chain without that drop, so the
# empty string reaches the sensor kit and wins over the env default. imu_source
# then builds a parameter path with a hole in it and the launch dies before any
# node starts:
#
#   Failed to load and resolve parameter file '.../imu_corrector_.param.yaml'
#
# Reading the same environment here makes the forwarded value correct whether or
# not the chain drops it. config/sensors.conf remains the single source; see
# config/README.md.
- arg:
    name: camera_model
    default: "$(env CAMERA_MODEL gscam)"
    description: "Camera driver: gscam | zedx | none. Defaults to $CAMERA_MODEL (config/sensors.conf)"

- arg:
    name: imu_source
    default: "$(env IMU_SOURCE xsens)"
    description: "IMU source: xsens | zed. Defaults to $IMU_SOURCE (config/sensors.conf)"

# gnss_receiver defaults to a REAL receiver, not "", for the same reason
# camera_model and imu_source do above — and this one was not survivable by
# accident. `""` is forwarded unconditionally and reaches the sensor kit, whose
# gnss.launch.xml resolves the topic with a dict lookup:
#
#   $(eval "{'ublox': ..., 'septentrio': ..., 'garmin': ...}['$(var gnss_receiver)']")
#
# An empty key is a KeyError, and it aborts the WHOLE launch — measured with
# stock `ros2 launch`, which got 27 nodes up and then died with
# `Caught exception in launch: ''`. The description claiming "empty string uses
# suite default" was never true: an <arg> forwarded with value="" overrides the
# sensor kit's own `default="ublox"` rather than deferring to it.
- arg:
    name: gnss_receiver
    default: "$(env GNSS_RECEIVER ublox)"
    description: "GNSS receiver: ublox | septentrio | garmin. Defaults to $GNSS_RECEIVER."

- arg:
    name: use_gnss
    default: "true"
    description: "Enable GNSS for outdoor operation. Set false indoors."

- arg:
    name: use_ntrip
    default: "true"
    description: "Enable NTRIP client for RTK corrections (ublox only)"

- arg:
    name: use_mapless_mode
    default: "false"
    description: "Enable mapless mode for indoor operation without localization"

# ── GPU acceleration ─────────────────────────────────────────────────────────
#
# One coarse switch, and a fine switch per stage that defaults from it. Both are
# launch arguments; nothing here is set from the environment by a user.
#
#   just launch                                  # CUDA everywhere (the default)
#   just launch use_cuda:=false                  # CPU everywhere
#   just launch pointcloud_backend:=cpu          # CUDA NDT, CPU preprocessing
#   just launch pose_source:=ndt                 # CUDA preprocessing, CPU NDT
#
# A fine argument given explicitly wins over the coarse one, because launch
# argument defaults are only consulted when the caller did not supply a value.
#
# The two stages have VERY different amounts of evidence behind them.
#
# pointcloud_backend:=cuda is measured. A full NDT replay of the NTU CSIE-1 bag
# scored cpu at 0.038 m scatter p95 / 0.179 deg yaw p95 and cuda at
# 0.035 / 0.167 over ~600 m of driving, so it does not regress localization.
# See docs/research/sensing/autoware-cuda-pointcloud-chain.md.
#
# pose_source:=cuda_ndt is NOT measured here, and on this desktop it does not
# work: NDT never activates, logging "Max iterations reached" and "Pose
# interpolation failed" until the harness gives up with "NDT never activated,
# it is latched off and will not recover on its own". That is not evidence
# against the feature. The installed cuda_ndt_matcher dates from 2026-08-17,
# its source has moved since, and rebuilding it on an x86 desktop fails in the
# cubecl-cuda dependency (E0425/E0432). The binary being exercised is stale.
#
# So: verify cuda_ndt on the Orin, where it is built and was developed, before
# trusting this default. If localization does not converge, the first thing to
# try is `pose_source:=ndt`, which is measured and works. `use_cuda:=false`
# puts both stages back on CPU.
#
# The GPU cost side is also unmeasured on the Orin, whose iGPU shares memory
# bandwidth with the CPU.
- arg:
    name: use_cuda
    default: "true"
    description: >-
      Coarse GPU switch. Sets the default for pointcloud_backend and
      pose_source; either can still be given explicitly to override it.

- arg:
    name: pointcloud_backend
    default: $(eval "'cuda' if '$(var use_cuda)'.lower() in ('true','1','yes') else 'cpu'")
    description: >-
      LiDAR preprocessing and concatenation: cpu | cuda. cuda runs crop box,
      distortion correction and ring outlier filtering as one
      CudaPointcloudPreprocessorNode into the CUDA concatenator. Defaults from
      use_cuda.

# The sensor kit is reached through tier4_sensing_component.launch.xml and
# tier4_sensing_launch/sensing.launch.xml, installed Autoware files that forward
# a fixed set of arguments and drop the rest, so the value crosses that gap in
# the environment. That is transport, not interface: the knob above is a launch
# argument and nobody needs to set POINTCLOUD_BACKEND by hand.
- set_env:
    name: POINTCLOUD_BACKEND
    value: "$(var pointcloud_backend)"

# Localization preset, included BEFORE pose_source is declared.
#
# Order is the whole point. A preset that names pose_source (aruco does) only
# takes effect if its <arg> is the FIRST declaration of that name: in ROS 2
# launch a later re-declaration cannot lower an already-set configuration.
# While this include sat below, `localization_preset:=aruco` was a silent no-op
# that ran a scan matcher instead, and said nothing about it.
#
# An explicit `pose_source:=` on the command line still wins over both, because
# a value supplied by the caller outranks any declaration default.
- arg:
    name: localization_preset
    default: "default"
    description: >-
      Localization preset: default, eagleye, aruco.
      aruco sets pose_source and additionally requires aruco_tag_map_path.

# Include localization preset (defines twist_source)
- include:
    file: "$(find-pkg-share golfcart_launch)/config/localization/preset/$(var localization_preset)_preset.yaml"

# pose_source is a METHOD selector, not an accelerator switch, and is
# deliberately NOT derived from use_cuda.
#
# Its values are aruco, ndt, cuda_ndt, yabloc and eagleye. Only two of those
# are the same algorithm on different hardware; the other three have no GPU
# counterpart to switch to. Deriving this from use_cuda meant a GPU toggle
# silently changed which localizer ran: `use_cuda:=false` rewrote a deliberate
# `yabloc` or `eagleye` choice to `ndt`, which is not a thing a GPU switch
# should ever do.
#
# Defaulted to `ndt` rather than `cuda_ndt` because cuda_ndt cannot yet
# initialise. Its per-frame cost is excellent, 40.5 ms against Autoware's
# 47.0 ms on the Orin, but its align service takes ~23 s against the caller's
# deadline so the stack never starts. Ask for it by name once that lands:
#
#   just launch pose_source:=cuda_ndt
#
# See docs/handover/2026-08-30-cuda-pipeline-to-orin.md.
- arg:
    name: pose_source
    default: "ndt"
    description: >-
      Pose estimation source: ndt, cuda_ndt, aruco, yabloc, eagleye.
      A localization_preset may set this; an explicit value here wins over it.
      aruco is indoor ArUco-board localization and REPLACES the scan matcher
      entirely -- no point cloud map is loaded and no NDT runs. It requires
      aruco_tag_map_path.

- arg:
    name: aruco_tag_map_path
    default: ""
    description: >-
      Hand-surveyed ArUco board map. Required when pose_source:=aruco, ignored
      otherwise. The localizer refuses to start without it: with no map it is
      not a degraded localizer, it is a silent one.
      Example: just launch "pose_source:=aruco aruco_tag_map_path:=./data/huaxia-campus/aruco_tag_map.yaml"

- arg:
    name: localization_stop_check
    default: "false"
    description: >-
      Require the vehicle to be stationary before an initial pose is accepted.
      Off by default because the ArUco localizer gates its own cold start on
      several consecutive agreeing solves, which works while moving. Turning it
      on is a commissioning policy choice.

# Where Autoware's model data lives. NOT the packaged /opt/autoware/<ver>/data:
# that is root-owned, and TensorRT writes each .engine next to its .onnx, so a
# read-only tree makes every model fail to cache and rebuild (and fail) on every
# launch. `just setup-autoware-data` builds a writable symlink farm here;
# `just build-engines` fills it in advance.
#
# Relative, like map_path above, so it resolves against the directory the launch
# is started from — the repository root in every supported workflow.
- arg:
    name: data_path
    default: "./data/autoware_data"
    description: "Autoware model/artifact directory. Must be WRITABLE: TensorRT caches .engine files here."

- arg:
    name: launch_perception
    default: "false"
    description: "Launch perception module (object detection). When false, empty objects are published."

# Preset Configuration
- arg:
    name: perception_preset
    default: "lidar_only"
    description: "Perception preset: lidar_only, camera_lidar_fusion, minimal"

# Include perception preset (defines perception_mode, use_traffic_light_recognition, etc.)
- include:
    file: "$(find-pkg-share golfcart_launch)/config/perception/preset/$(var perception_preset)_preset.yaml"

- include:
    file: "$(find-pkg-share golfcart_launch)/launch/golfcart_autoware.launch.xml"
    if: $(var is_master)
    arg:
    -
      name: vehicle_model
      value: golfcart_vehicle
    -
      name: is_simulation
      value: $(var is_simulation)
    -
      name: sensor_model
      value: golfcart_sensor_kit
    -
      name: map_path
      value: ./data/COSS-map-planning
    -
      name: data_path
      value: $(var data_path)
    -
      name: launch_vehicle
      value: "true"
    -
      name: launch_system
      value: "true"
    -
      name: launch_map
      value: "true"
    -
      name: launch_sensing
      value: "true"
    -
      name: launch_sensing_driver
      value: "true"
    -
      name: launch_localization
      value: "true"
    -
      name: launch_perception
      value: $(var launch_perception)
    -
      name: launch_planning
      value: "true"
    -
      name: launch_control
      value: "true"
    -
      name: perception_mode
      value: $(var perception_mode)
    -
      name: use_traffic_light_recognition
      value: $(var use_traffic_light_recognition)
    -
      name: traffic_light_recognition/enable_fine_detection
      value: "false"
    -
      name: use_detection_by_tracker
      value: $(var use_detection_by_tracker)
    -
      name: use_image_segmentation_based_filter
      value: $(var use_image_segmentation_based_filter)
    -
      name: use_pointcloud_map
      value: $(var use_pointcloud_map)
    -
      name: use_sim_time
      value: "false"
    -
      name: rviz_config
      value: "$(find-pkg-share golfcart_launch)/rviz/golfcart.rviz"
    -
      name: pose_source
      value: $(var pose_source)
    -
      name: aruco_tag_map_path
      value: $(var aruco_tag_map_path)
    -
      name: initialization_stop_check
      value: $(var localization_stop_check)
    -
      name: twist_source
      value: $(var twist_source)
    -
      name: lidar_model
      value: $(var lidar_model)
    -
      name: camera_model
      value: $(var camera_model)
    -
      name: imu_source
      value: $(var imu_source)
    -
      name: gnss_receiver
      value: $(var gnss_receiver)
    -
      name: use_gnss
      value: $(var use_gnss)
    -
      name: use_ntrip
      value: $(var use_ntrip)
    -
      name: sensor_suite
      value: $(var sensor_suite)
    -
      name: use_mapless_mode
      value: $(var use_mapless_mode)

# Publish empty objects when perception is disabled
# This unblocks behavior_path_planner which waits for /perception/object_recognition/objects
- group:
    if: $(var is_master)
    children:
    - group:
        unless: $(var launch_perception)
        children:
        - node:
            pkg: autoware_dummy_perception_publisher
            exec: empty_objects_publisher
            name: empty_objects_publisher
            namespace: perception/object_recognition
            remap:
            - from: ~/output/objects
              to: /perception/object_recognition/objects

# ZED X camera - runs on the orin (slave) host.
#
# Included directly rather than through sensing.launch.xml, because the whole
# sensing subtree hangs off golfcart_autoware.launch.xml, which is master-only.
# camera.launch.xml is still the single entry point for every camera on the
# vehicle; the orin just reaches it by a shorter path.
- group:
    if: $(var is_orin)
    children:
    - include:
        file: "$(find-pkg-share golfcart_sensor_kit_launch)/launch/camera.launch.xml"
        arg:
        -
          name: camera_model
          value: zedx

# Rosbag recording used to live here, as one `node:` entry per host. It is now a
# separate systemd unit (golfcart-record.service ->
# scripts/recording/record_unit_exec.sh, topic lists in config/recording/).
# Recording deliberately no longer shares play_launch's process tree: as a
# play_launch child, every multi-gigabyte bag stopped from the foreground came
# out with a 0-byte metadata.yaml (docs/roadblocks.md). Outside that tree,
# play_launch's shutdown cannot reach the recorder at all. Do not re-add a
# recorder here.

# System Monitor, on http://localhost:8080/
#
# `just launch` puts play_launch's own web UI on 8081 (justfile), which only
# makes sense as a reservation of 8080 for this. It was commented out on
# 2026-04-24 by 286fac6, whose entire message is "disable system monitor
# temporary" and which records no reason. Four months and a package rename
# later, the mode availability strip and failing-path view live here and are
# unreachable from `just launch` while this stays off, so it is back on.
#
# It brings up rosbridge on 9090 with it, because the strip reads Autoware's
# diagnostic graph straight from the browser. Turn both off together with
# launch_web_monitor:=false.
#
# NOT `launch_system_monitor`: that name is already taken, by Autoware's
# system_monitor (cpu, gpu, hdd, mem, net, ntp) in
# golfcart_autoware.launch.xml. Those monitors are diagnostic PUBLISHERS that
# feed the graph this page displays, so overloading the name would let someone
# trying to hide a web page silently switch off the hardware monitoring behind
# it.
- arg:
    name: launch_web_monitor
    default: "true"
- group:
    if: $(var launch_web_monitor)
    children:
    - include:
        file: "$(find-pkg-share golfcart_system_monitor)/launch/golfcart_system_monitor.launch.yaml"
        arg:
        -
          name: use_gnss
          value: $(var use_gnss)

