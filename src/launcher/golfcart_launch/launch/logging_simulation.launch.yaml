launch:
# Logging Simulation Launch File
# This launch file is used for replaying rosbags with Autoware stack
# It uses sim_time and disables sensor drivers (data comes from rosbag)

- arg:
    name: is_simulation
    default: "true"
    description: "Enable simulation mode (disables PWM output to hardware)"

# Sensor Suite Configuration
- arg:
    name: sensor_suite
    default: "vlp32c"
    description: "Predefined sensor suite: vlp32c, custom"

# Individual Sensor Parameters (override suite defaults when sensor_suite=custom)
- arg:
    name: lidar_model
    default: ""
    description: "LiDAR model (vlp32c) - empty string uses suite default"

# Defaulted from the environment, not "", for the reason golfcart.launch.yaml
# spells out at length: an <arg> forwarded with value="" OVERRIDES the sensor
# kit's own default rather than deferring to it, and the kit resolves both with
# a dict lookup. An empty key is a KeyError that aborts the whole launch.
#
# Measured 2026-08-29: resolving this file with its own defaults and the default
# sensor_model died with `KeyError: ''`. It only ever worked because every
# caller either passed these explicitly or used sample_bag_sensor_kit, whose
# sensing.launch.xml has no such lookup. The "empty string uses suite default"
# description was never true.
- arg:
    name: camera_model
    default: "$(env CAMERA_MODEL gscam)"
    description: "Camera driver: gscam | zedx | none. Defaults to $CAMERA_MODEL."

- arg:
    name: imu_source
    default: "$(env IMU_SOURCE xsens)"
    description: "IMU source: xsens | zed. Defaults to $IMU_SOURCE."

- arg:
    name: gnss_receiver
    default: "$(env GNSS_RECEIVER ublox)"
    description: "GNSS receiver: ublox | septentrio | garmin. Defaults to $GNSS_RECEIVER."

- arg:
    name: use_gnss
    default: "true"
    description: "Enable GNSS for outdoor operation. Set false indoors."

- arg:
    name: use_ntrip
    default: "false"
    description: "Enable NTRIP client for RTK corrections (disabled in simulation)"

- arg:
    name: use_mapless_mode
    default: "false"
    description: "Enable mapless mode for indoor operation without localization"

# Same coarse/fine pair as golfcart.launch.yaml, so a replay defaults to the
# stack the vehicle runs. use_cuda:=false puts both stages back on CPU; either
# fine argument can still be given on its own.
- arg:
    name: use_cuda
    default: "true"
    description: "Coarse GPU switch; sets the default for pointcloud_backend"

- arg:
    name: pointcloud_backend
    default: $(eval "'cuda' if '$(var use_cuda)'.lower() in ('true','1','yes') else 'cpu'")
    description: "LiDAR preprocessing and concatenation: cpu | cuda. Defaults from use_cuda."

- set_env:
    name: POINTCLOUD_BACKEND
    value: "$(var pointcloud_backend)"

# Not derived from use_cuda: pose_source picks a localization METHOD, and only
# two of its values are the same algorithm on different hardware. Same reasoning
# as golfcart.launch.yaml, which spells it out. cuda_ndt is asked for by name.
- arg:
    name: pose_source
    default: "ndt"
    description: "Pose estimation source: ndt, cuda_ndt, aruco, yabloc, eagleye"

# Preset Configuration
- arg:
    name: perception_preset
    default: "lidar_only"
    description: "Perception preset: lidar_only, camera_lidar_fusion, minimal"

- arg:
    name: localization_preset
    default: "default"
    description: "Localization preset: default, eagleye"

# Include perception preset (defines perception_mode, use_traffic_light_recognition, etc.)
# Autoware model/artifact directory. NOT the packaged /opt/autoware/<ver>/data:
# that is root-owned, and TensorRT writes each .engine next to its .onnx, so a
# read-only tree makes every model fail to cache and rebuild on every launch.
# `just setup-autoware-data` creates this; `just build-engines` fills it.
- arg:
    name: data_path
    default: "./data/autoware_data"
    description: "Autoware model/artifact directory. Must be WRITABLE: TensorRT caches .engine files here."

- include:
    file: "$(find-pkg-share golfcart_launch)/config/perception/preset/$(var perception_preset)_preset.yaml"

# Include localization preset (defines twist_source)
- include:
    file: "$(find-pkg-share golfcart_launch)/config/localization/preset/$(var localization_preset)_preset.yaml"

# Logging simulation specific parameters
- arg:
    name: launch_perception
    default: "true"
    description: "Launch perception module"

- arg:
    name: launch_planning
    default: "true"
    description: "Launch planning module"

- arg:
    name: launch_control
    default: "true"
    description: "Launch control module"

- arg:
    name: rviz
    default: "true"
    description: "Launch RViz"

# The vehicle, the sensor kit and the map travel together: a bag recorded on one
# rig cannot be replayed against another rig's calibration or another site's map.
# They were hardcoded to the golf cart, which meant this file could only ever
# replay golf cart bags, and the Autoware sample bag needed a separate launch
# tree in cuda_ndt_matcher to be replayable at all.
#
# Replaying the Autoware sample bag (3 LiDARs as velodyne_packets):
#
#   just launch-sim-logging "vehicle_model:=sample_vehicle \
#     sensor_model:=sample_bag_sensor_kit \
#     map_path:=./src/localization/cuda_ndt_matcher/data/sample-map"
#
# `sample_vehicle` is Autoware's own; only the sensor kit needed writing, because
# sample_sensor_kit declares four LiDARs and that bag carries three.
- arg:
    name: vehicle_model
    default: "golfcart_vehicle"
    description: "Vehicle model: golfcart_vehicle | sample_vehicle"

- arg:
    name: sensor_model
    default: "golfcart_sensor_kit"
    description: "Sensor kit: golfcart_sensor_kit | sample_bag_sensor_kit"

- arg:
    name: map_path
    default: "./data/COSS-map-planning"
    description: "Map directory; must match the bag being replayed"

# Seed pose for the replay. Empty means no seed, and the pose initializer then
# waits on GNSS or the align service. A bag whose site has no captured pose
# needs this: without it the scan matcher runs from an arbitrary prior and
# produces a flailing trajectory that still looks like output.
#
#   Autoware sample bag: initial_pose:="[89571.0, 42301.0, -3.3, 0.0, 0.0, 0.28, 0.96]"
- arg:
    name: initial_pose
    default: "[]"
    description: "x, y, z, qx, qy, qz, qw. A 7-element list seeds the pose."

- include:
    file: "$(find-pkg-share golfcart_launch)/launch/golfcart_autoware.launch.xml"
    arg:
    -
      name: vehicle_model
      value: $(var vehicle_model)
    -
      name: is_simulation
      value: $(var is_simulation)
    -
      name: sensor_model
      value: $(var sensor_model)
    -
      name: map_path
      value: $(var map_path)
    -
      name: initial_pose
      value: $(var initial_pose)
    -
      name: data_path
      value: $(var data_path)
    -
      name: launch_vehicle
      value: "true"
    -
      name: launch_vehicle_interface
      value: "false"
    -
      name: launch_system
      value: "true"
    -
      name: system_run_mode
      value: "logging_simulation"
    -
      name: launch_system_monitor
      value: "false"
    -
      name: launch_dummy_diag_publisher
      value: "false"
    -
      name: launch_map
      value: "true"
    -
      name: launch_sensing
      value: "true"
    -
      name: launch_sensing_driver
      value: "false"
    -
      name: launch_localization
      value: "true"
    -
      name: launch_perception
      value: $(var launch_perception)
    -
      name: launch_planning
      value: $(var launch_planning)
    -
      name: launch_control
      value: $(var launch_control)
    -
      name: perception_mode
      value: $(var perception_mode)
    -
      name: use_traffic_light_recognition
      value: $(var use_traffic_light_recognition)
    -
      name: traffic_light_recognition/enable_fine_detection
      value: "false"
    -
      name: use_detection_by_tracker
      value: $(var use_detection_by_tracker)
    -
      name: use_image_segmentation_based_filter
      value: $(var use_image_segmentation_based_filter)
    -
      name: use_pointcloud_map
      value: $(var use_pointcloud_map)
    -
      name: use_sim_time
      value: "true"
    -
      name: rviz
      value: $(var rviz)
    -
      name: rviz_config
      value: "$(find-pkg-share golfcart_launch)/rviz/golfcart.rviz"
    -
      name: pose_source
      value: $(var pose_source)
    -
      name: twist_source
      value: $(var twist_source)
    -
      name: lidar_model
      value: $(var lidar_model)
    -
      name: camera_model
      value: $(var camera_model)
    -
      name: imu_source
      value: $(var imu_source)
    -
      name: gnss_receiver
      value: $(var gnss_receiver)
    -
      name: use_gnss
      value: $(var use_gnss)
    -
      name: use_ntrip
      value: $(var use_ntrip)
    -
      name: sensor_suite
      value: $(var sensor_suite)
    -
      name: use_mapless_mode
      value: $(var use_mapless_mode)

# System Monitor
- include:
    file: "$(find-pkg-share golfcart_system_monitor)/launch/golfcart_system_monitor.launch.yaml"
    arg:
    -
      name: use_gnss
      value: $(var use_gnss)
