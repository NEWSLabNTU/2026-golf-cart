# NEWSLab's golf cart (NEWSLabNTU/2026-golf-cart): the cart with its cargo box, roof lidar and
# front sensor deck, for the NTU twin demo on Isaac Sim (golf cart Phase 10).
#
# The cart runs its OWN Autoware (golfcart_launch); this spec gives the simulator the car and
# its sensors. Named newslab_golfcart so that what autoware_sim_vehicle generates from it
# (newslab_golfcart_*) never shadows the cart's own golfcart_* packages.
#
# Geometry, the sensor kit and every sensor pose are the cart's own files, verbatim:
#   golfcart_vehicle_description/config/vehicle_info.param.yaml, mirror.param.yaml
#   golfcart_sensor_kit_description/config/sensors_calibration.yaml,
#   sensor_kit_calibration.yaml
# Sensor topics, frames and rates are its drivers' (golfcart_sensor_kit_launch). Nothing
# records the cart's mass, drive or brakes: those are estimates (provenance, assumed: true).
spec_version: 2
name: newslab_golfcart
description: NEWSLab golf cart with cargo box and sensor deck (geometry and sensors measured; mass and drive estimated)

body:
  # The body: golf cart repo src/simulation/golfcart_twin/body/make_body.py, installed in the
  # Isaac vehicle catalogue (SWB_VEHICLE_USD) under this id. There is no CARLA blueprint.
  catalogue_model: vehicle.newslab.golfcart
  ground_clearance: 0.12

geometry:
  wheel_base: 2.061
  wheel_tread: 1.213
  wheel_radius: 0.265
  wheel_width: 0.14
  front_overhang: 0.406
  rear_overhang: 0.821
  left_overhang: 0.001
  right_overhang: 0.001
  vehicle_height: 2.005
  max_steer_angle: 0.52

mirror:
  min_longitudinal_offset: 0.0
  max_longitudinal_offset: 0.0
  min_lateral_offset: 0.0
  max_lateral_offset: 0.0
  min_height_offset: 0.0
  max_height_offset: 0.0

inertia:
  mass: 750.0
  com_front_fraction: 0.40
  com_lateral: 0.0
  com_height: 0.60
  inertia_box: [3.3, 1.35, 1.9]

wheels:
  mass: 10.0
  damping_rate: 0.25

tires:
  friction: 1.0
  lat_stiff_max_load: 2.0
  lat_stiff_value: 17.0
  long_stiff_value: 1875.0    # kg: 10 x a quarter-car rest load, as the Model 3's
  friction_vs_slip: [[0.0, 1.0], [0.1, 1.0], [1.0, 0.8]]

brakes:
  max_brake_torque: 800.0
  hold_brake_torque: 400.0
  distribution: dynamic_axle_load
  dead_time: 0.1
  time_constant: 0.1
  abs: {enabled: false, slip_release: 0.25, slip_reapply: 0.15, release_rate: 8.0, apply_rate: 4.0, min_speed: 1.5}

powertrain:
  model: ev
  max_drive_torque: 600.0
  drive_axle: rear
  gear_ratio: 12.0
  motor_peak_torque: 50.0
  motor_peak_power: 5000.0
  # The VCU's target-speed ceiling (vehicle_interface max_speed_mps 2.5), as the motor's top
  # speed: torque tapers to 0 over the last 5 %, at 1100 rpm / 12 x 2 pi x 0.265 m = 2.54 m/s.
  motor_max_rpm: 1100.0
  motor_time_constant: 0.1
  regen_max_torque: 15.0
  regen_max_power: 2000.0
  regen_fade_speeds: [0.5, 1.5]
  traction_control: {enabled: false, slip_limit: 0.25, slip_reapply: 0.15, release_rate: 20.0, apply_rate: 5.0}

resistance:
  rolling_coefficient: 0.015
  drag_coefficient: 0.9
  frontal_area: 2.5
  air_density: 1.2

steering:
  ackermann: true
  time_constant: 0.27
  rate_limit: 0.0

suspension:
  frequency: 2.0
  damping_ratio: 0.4
  travel: 0.1

isaac:
  physx:
    substeps: 8
    substep_threshold_speed: 5.0
    min_active_slip_denominator: 4.0
    min_passive_slip_denominator: 4.0
    min_lateral_slip_denominator: 1.0
    sticky_tire_threshold_speed: 0.2
    sticky_tire_threshold_time: 1.0
    longitudinal_sticky_tire_damping: 200.0
    lateral_sticky_tire_damping: 200.0

# base_link -> sensor_kit_base_link: sensors_calibration.yaml. The kit's base is the VLP-32C.
sensor_kit:
  mount: {x: 0.46, y: 0.0, z: 1.966, roll: -0.016794, pitch: 0.031978, yaw: 0.0}

# Lidar profiles: OmniLidar USDs made by isaac/make_lidars.py, relative to the Isaac rig
# (isaac/newslab_golfcart.rig.yaml), which aib resolves from the rig's directory.
sensors:
  vlp32:
    type: lidar
    calibration_key: vlp32c
    link: velodyne
    frame: velodyne
    topic: /sensing/lidar/vlp32/velodyne_points
    mount: {x: 0.0, y: 0.0, z: 0.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
    channels: 32
    rate_hz: 10.0
    range: 200.0
    vertical_fov: [-25.0, 15.0]
    isaac:
      enabled: true
      usd: lidars/VLP32C.usda
      point_format: xyzircaedt     # Nebula's, as the cart's driver publishes
      rings_by_elevation: true
  falcon:
    type: lidar
    calibration_key: falcon
    link: seyond
    frame: seyond
    topic: /sensing/lidar/falcon/iv_points
    mount: {x: 2.197845303, y: 0.05262411, z: -1.430838877, roll: -0.077524484, pitch: -1.333385551, yaw: -3.073378269}
    channels: 40
    rate_hz: 10.0
    range: 250.0
    vertical_fov: [-14.0, 11.0]
    isaac:
      enabled: true
      usd: lidars/Falcon.usda
      # The driver publishes in the sensor's axes (x up, y right, z forward; coordinate_mode 0):
      # the emitter's +x forward is seyond's +z, its +y is seyond's -y, its +z is seyond's +x.
      emitter_rpy: [3.141592653589793, -1.5707963267948966, 0.0]
  zed:
    type: camera
    calibration_key: zed_camera_link
    link: zed_camera_link
    frame: zed_left_camera_optical_frame
    topic: /sensing/camera/zed/rgb/color/rect/image
    info_topic: /sensing/camera/zed/rgb/color/rect/camera_info
    mount: {x: 2.225473859, y: 0.032849606, z: -1.537299588, roll: 0.016835173, pitch: -0.037701763, yaw: 0.006832191}
    width: 1920
    height: 1200
    horizontal_fov: 110.0
    rate_hz: 10.0
    isaac:
      enabled: true
  camera_left:
    type: camera
    calibration_key: camera_left
    link: camera_left
    frame: camera_left_optical_link
    topic: /sensing/camera/left/image_raw
    info_topic: /sensing/camera/left/camera_info
    mount: {x: 0.9426154546835364, y: 0.5584876525550044, z: -1.1269152055909257, roll: -0.08157476261707551, pitch: -0.1090220082688429, yaw: 0.7341035203898821}
    width: 1920
    height: 1280
    horizontal_fov: 88.4
    rate_hz: 10.0
    isaac:
      enabled: false
  camera_right:
    type: camera
    calibration_key: camera_right
    link: camera_right
    frame: camera_right_optical_link
    topic: /sensing/camera/right/image_raw
    info_topic: /sensing/camera/right/camera_info
    mount: {x: 0.9795053939071179, y: -0.4553600340666411, z: -1.1362438424601349, roll: 0.028163430272001973, pitch: -0.08230178821024782, yaw: -0.09271942248981242}
    width: 1920
    height: 1280
    horizontal_fov: 88.4
    rate_hz: 10.0
    isaac:
      enabled: false
  camera_rear:
    type: camera
    calibration_key: camera_rear
    link: camera_rear
    frame: camera_rear_optical_link
    topic: /sensing/camera/rear/image_raw
    info_topic: /sensing/camera/rear/camera_info
    mount: {x: -0.906242929, y: 0.02847863, z: -1.695602761, roll: -0.016802674, pitch: 0.031973444, yaw: 3.141052803}
    width: 1920
    height: 1280
    horizontal_fov: 88.4
    rate_hz: 10.0
    isaac:
      enabled: false
  imu:
    type: imu
    calibration_key: imu_link
    link: imu_link
    frame: imu_link
    topic: /sensing/imu/xsens/imu_raw
    mount: {x: -1.124434567, y: 0.033220893, z: -0.191518348, roll: 0.016802589, pitch: -0.031973489, yaw: -0.000537196}
    rate_hz: 100.0
    isaac:
      enabled: true
  gnss:
    type: gnss
    calibration_key: gnss_base_link
    link: gnss_base_link
    frame: gnss_base_link
    topic: /sensing/gnss/ublox/nav_sat_fix
    mount: {x: 0.37863526, y: 0.004433895, z: -0.263991818, roll: 0.016802589, pitch: -0.031973489, yaw: -0.000537196}
    rate_hz: 1.0
    isaac:
      enabled: true

provenance:
  body.catalogue_model: {basis: "golf cart repo fe0ee89, src/simulation/golfcart_twin/body: a low-poly body from 10 photos of the cart (2026-11-07), sized to vehicle_info"}
  body.ground_clearance: {assumed: true, basis: "a golf cart's underbody over 0.53 m wheels"}
  geometry: {basis: "golfcart_vehicle_description/config/vehicle_info.param.yaml (golfcart_vehicle_launch, branch 2026-golf); max_steer_angle 0.52 is the VCU's +-30 deg less a margin, not yet measured on the cart"}
  mirror: {basis: "golfcart_vehicle_description/config/mirror.param.yaml"}
  inertia.mass: {assumed: true, basis: "no record of the cart's mass: a two-seat electric utility cart with lead-acid or lithium pack (~500-600 kg), the four-door cargo box and the computers; 750 kg"}
  inertia.com_front_fraction: {assumed: true, basis: "the cargo box and the pack over the rear axle"}
  inertia.com_height: {assumed: true, basis: "the cargo box lifts it above a bare cart's ~0.5 m"}
  inertia.inertia_box: {assumed: true, basis: "a uniform box of the cart's size"}
  wheels.mass: {assumed: true, basis: "a 10-inch alloy wheel with a 21-inch tire"}
  tires: {assumed: true, basis: "dry asphalt; the Model 3's PhysX tire scaled to the rest load"}
  brakes: {assumed: true, basis: "drum brakes, no ABS; torque past the tire limit (~490 N m per wheel at rest load)"}
  powertrain: {assumed: true, basis: "a 48 V AC motor of ~5 kW through a ~12:1 reduction to the rear axle: ~3 m/s^2 and ~27 km/h top speed; the cart's VCU caps it at 2.5 m/s (vehicle_interface.param.yaml)"}
  powertrain.motor_max_rpm: {basis: "the cart's VCU caps its speed at 2.5 m/s (golfcart_vehicle_launch vehicle_interface.param.yaml max_speed_mps); modelled as the motor's top speed, 2.54 m/s, since the sim has no VCU. Autoware plans faster (4.17 m/s, its default) on the cart too"}
  resistance: {assumed: true, basis: "small tires on asphalt; a boxy body ~1.35 x 2.0 m"}
  steering.time_constant: {basis: "golfcart_vehicle_description simulator_model.param.yaml steer_time_constant 0.27 (its 0.24 s dead time is not modelled)"}
  suspension: {assumed: true, basis: "a utility cart's stiff leaf/coil suspension"}
  isaac.physx: {basis: "tesla_model3's (swb roadmap 043 and 059 N8)"}
  sensor_kit: {basis: "golfcart_sensor_kit_description/config/sensors_calibration.yaml"}
  sensors: {basis: "mounts: golfcart_sensor_kit_description/config/sensor_kit_calibration.yaml (falcon: a DEGENERATE LCTK merge, per its comment); topics, frames and rates: golfcart_sensor_kit_launch (VLP32.param.yaml, seyond.param.yaml, camera_*.yaml, zed.param.yaml, ublox_f9p.yaml, xsens); camera FOVs from camera_*_calibration.yaml fx (88.4 deg) and the ZED X 2.2 mm lens (110 deg, assumed)"}
