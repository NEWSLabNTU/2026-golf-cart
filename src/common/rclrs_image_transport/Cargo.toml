[package]
name = "rclrs_image_transport"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "image_transport-style JPEG transport and camera subscriber for rclrs"

[lib]
name = "rclrs_image_transport"
path = "src/lib.rs"

[dependencies]
thiserror = "1"

# The codec core, deliberately a separate crate with no ROS dependency so it
# can be built and tested with plain `cargo test` outside an ament workspace.
image_transport_codec = { path = "codec" }

# ROS 2 dependencies (resolved via ament_index by colcon-cargo-ros2, which
# redirects these to the generated workspace bindings through a generated
# [patch.crates-io] -- the versions requested here are never the ones built).
rclrs = "*"
sensor_msgs = "*"
std_msgs = "*"
