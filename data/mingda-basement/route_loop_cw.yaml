# Clockwise loop centreline for the Ming-Da basement, data/mingda-basement map
# frame, in the direction of travel (clockwise from above, leaving the board
# spot westward, -x). Closed: the first point is repeated last. Each point
# carries the lane width there; speed_limit (km/h) holds from the point that
# sets it to the next one that does, and so does turn (left | right | straight
# | none), which becomes the lanelet's turn_direction tag: Autoware blinks the
# indicator from 3 s (at least 10 m) before such a lanelet.
#
# Seeded by the 2026-09-24 clockwise drive (NAS dataset/2026-09-24
# indoor-experiment): data/basement-indoor/route_loop_cw.yaml carried into this
# frame by T_mingda * inv(T_indoor), yaw +3.458 deg. That driven line was not
# centred in the aisle: a 2.4 m lane on it crossed the curb along the bottom
# straight and the wall of the box at x 11-16, y 21.7.
#
# Fitted 2026-10-22 against the point cloud (the basement-indoor PCD in this
# frame, the same SLAM cloud). Obstacles: 0.1 m cells with >= 3 points at
# 0.25-2.0 m above the floor (the map has no floor; ducts start at 2.2 m).
# Sparse cells stay in. Removed: 70 points floating at z 1.0-1.67 on the driven
# path at (4, 2), which the cart drove through. Added: the curb the cloud cannot
# resolve, y -3.2, located from the cart at x ~ 11 (dd58eb4); its extent
# x 7.5-16.0 is ASSUMED.
#
# Centre: shifted along the normal to equalise the edges' clearance, rays capped
# at 3.5 m, weighted by 1 / span^4 so a narrow gap holds its neighbours, 6 m
# window, three passes; then relaxed wherever the radius over 1 m chords was
# under 3.5 m. Width: min(2.5, free span - 0.4) over a 6 m running minimum,
# floor 1.5.
#
# Reworked 2026-10-23 on two stretches: the west side from y 14 round the top
# aisle to the east side at y 10, and the east side below y 2 round the
# south-east corner to x 12 on the bottom straight. The rest is the 2026-10-22
# fit, unchanged. Two corrections to the obstacles:
#
# - Removed: what the fit above took for a car parked on the north side of the
#   top aisle, a contour at z 0.8-1.7 m, x 10.5-16.2, y 23.5-25.2. It is in the
#   survey cloud only: no live VLP-32C scan of the 2026-09-24 clockwise drive
#   hits it, and the left camera shows open floor there. Something present
#   while the map was surveyed.
# - Added: the board hanging from the ceiling over the north half of the top
#   aisle, x 12.35-12.6, y 23.6-24.65, lowest edge 2.15 m. The 0.25-2.0 m band
#   never saw it. The driver steers right to avoid it, so it is an obstacle for
#   the whole cart. The band's top is now 2.13 m: the hand drive passed directly
#   under ceiling items as low as 2.14 m and under nothing lower, so 2.14 m is
#   the clearance proven on the cart.
#
# The board leaves 1.8 m between itself and the box wall (y 21.8). Width there
# is 1.5 m, held while any part of the cart (base_link -0.82 .. +2.47 m) is
# beside the board and on round the right turn past the box wall's end
# (x 15.8), then eased back to 2.5 m over 3 m.
#
# The centre is the 2026-10-22 line moved along its normals, by bounded least
# squares: the gentlest bends (second differences, reweighted until no radius
# over 0.5 m chords is under 3.8 m) subject to both lane edges keeping a margin
# off every obstacle cell, re-solved from its own result until it settles.
# Free space is measured along each normal in a strip 0.5 m wide, so a thin row
# of cells cannot slip between points 0.5 m apart (a duct at 2.11 m at (3, 20)
# did). Margins: 0.25 m; 0.3 m round the north-east turn, where the simulated
# cart cut 0.16 m inside the line toward the wall's end, and on the bottom
# stretch, which moves at most 0.46 m north off a ceiling item 2.04 m up at
# (16.15, -6.95); 0.15 m beside the board, where 1.5 m of lane fills the gap.
# Beside the board the centre is also held between y 22.56 and 22.84 for every
# point at which any part of the cart is level with it: it runs at y 22.70, the
# 1.215 m cart 0.29 m off the wall and 0.28 m off the board.
#
# Result, measured on the built lanelets: no obstacle cell inside the lane, the
# nearest cell face 0.13 m outside an edge (the board). 2.5 m except x 8.0 on
# the top aisle round to y 20.8 on the east side (11 m), 1.5 m at the
# narrowest; that stretch plus 2 m either side is 5.4 km/h, the rest 7. Tightest
# radius 3.8 m by the builder's 1 m check, against the 3.6 m the vehicle
# description's 0.52 rad steer allows. Planning simulator, two laps: every leg
# arrived; footprint never within 0.12 m of an obstacle cell (the front-left
# corner at the board, the cart 7 deg nose-up coming out of the north-west
# corner); 0.19 m at the wall's end; steering peaked at 28.7 of 29.8 deg.
#
# Built into lanelet2_map_loop.osm beside lanelet2_map.osm (the straight lane),
# selected with lanelet2_map_file:=lanelet2_map_loop.osm. Not --write, which
# would overwrite the straight lane:
#
#   python3 scripts/map/centerline_to_lanelet.py data/mingda-basement/route_loop_cw.yaml \
#       --map-dir data/mingda-basement --width 2.5 --ele 0.0 --speed-limit 7 --smoothing 0 \
#       > data/mingda-basement/lanelet2_map_loop.osm
#
# Refitted 2026-11-09 from three clockwise laps driven by hand (sessions
# 20261109_224655, 20261109_224858, 20261109_230430), NDT poses
# (/localization/pose_estimator/pose_with_covariance; the EKF track drifted up
# to 0.7 m off NDT on the east and west sides). Every driven path is safe
# ground: the driver steers round the hanging plates the obstacle grid cannot
# see (the Velodyne on the roof) and uses the full width of the two-lane west
# and east roads. At each station the centre is the middle of the three laps'
# envelope, and the width covers every lap plus the cart (1.215 m) plus 0.1 m a
# side, floor 1.5 (2.0 on the two-lane west and east roads, so the
# whole width the driver uses is lane and a goal can stand there), cap 3.5. The south straight (x 8-16) stays on the measured
# line y = -4.324 + 0.00567 x (session 20261109_223127). Corners smoothed only
# to 3.0 m radius, as driven: tighter than the vehicle model's 3.6 m (0.52 rad),
# and far tighter than the ~5.1 m the 22 deg right steering stop allows in AUTO
# (vendor issue), so AUTO cannot follow these corners until that is fixed.
# All three laps stay inside the lane. The lane edge touches the hanging board's
# grid cells at (12.4, 23.65): the cart passes it with 0.1 m to spare.
#
# 2026-11-10: 5 km/h round the loop (was 7), and 3 km/h through the narrow
# north lane, from 1 m into the right turn into it (4.73, 20.29) until the cart
# has turned out onto the east side (18.25, 18.18); replaces the 5.4 km/h
# stretch that began mid-turn. The four corners are tagged turn: right, each from where the
# heading starts to change by more than 2 deg per point to where it stops; the
# two north corners are stretched to the 3 km/h zone's ends, so neither leaves
# a lanelet stub beside it. Both speeds take effect only with the vehicle
# interface's min_speed_mps below them (0.8 m/s since this change; it was 1.5,
# which raised every setpoint to 5.4 km/h).
