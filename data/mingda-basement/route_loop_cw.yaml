# Clockwise loop centreline for the Ming-Da basement, data/mingda-basement map
# frame, in the direction of travel (clockwise from above, leaving the board
# spot westward, -x). Closed: the first point is repeated last. Each point
# carries the lane width there; speed_limit (km/h) holds from the point that
# sets it to the next one that does.
#
# Seeded by the 2026-09-24 clockwise drive (NAS dataset/2026-09-24
# indoor-experiment): data/basement-indoor/route_loop_cw.yaml carried into this
# frame by T_mingda * inv(T_indoor), yaw +3.458 deg. That driven line was not
# centred in the aisle: a 2.4 m lane on it crossed the curb along the bottom
# straight and the wall of the box at x 11-16, y 21.7.
#
# Fitted 2026-10-22 against the point cloud (the basement-indoor PCD in this
# frame, the same SLAM cloud). Obstacles: 0.1 m cells with >= 3 points at
# 0.25-2.0 m above the floor (the map has no floor; ducts start at 2.2 m).
# Sparse cells stay in: a car parked on the north side of the top aisle is one
# LiDAR ring's contour at z 1.0-1.3, reaching y 23.75 at x 14.5-15.8. Removed:
# 70 points floating at z 1.0-1.67 on the driven path at (4, 2), which the cart
# drove through. Added: the curb the cloud cannot resolve, y -3.2, located from
# the cart at x ~ 11 (dd58eb4); its extent x 7.5-16.0 is ASSUMED.
#
# Centre: shifted along the normal to equalise the edges' clearance, rays capped
# at 3.5 m, weighted by 1 / span^4 so a narrow gap holds its neighbours, 6 m
# window, three passes; then relaxed wherever the radius over 1 m chords was
# under 3.5 m. Width: min(2.5, free span - 0.4) over a 6 m running minimum,
# floor 1.5.
#
# Result: no obstacle cell inside the lane. 2.5 m everywhere except the top
# aisle, x 7.0 -> 18.3 (13.5 m), which narrows to 1.55 m at x 14.5-15.8, where
# the gap between the box wall and the parked car is 2.0 m: the lane edges are
# 0.05 m off both, the 1.215 m cart about 0.4 m when centred. That stretch
# plus 2 m either side is 2 km/h, the rest 4. Tightest corner radius 3.6 m,
# wider than the 3.3 m driven by hand, under the 5.7 m the vehicle model's
# 0.349 rad steer allows, so the builder warns.
#
# Built into lanelet2_map_loop.osm beside lanelet2_map.osm (the straight lane),
# selected with lanelet2_map_file:=lanelet2_map_loop.osm. Not --write, which
# would overwrite the straight lane:
#
#   python3 scripts/map/centerline_to_lanelet.py data/mingda-basement/route_loop_cw.yaml \
#       --map-dir data/mingda-basement --width 2.5 --ele 0.0 --speed-limit 4 --smoothing 0 \
#       > data/mingda-basement/lanelet2_map_loop.osm
