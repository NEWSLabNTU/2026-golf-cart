# Drivable centreline for the basement, map frame (board-anchored, Local).
#
# Where it came from: the NDT-tracked path of the 2026-09-24 clockwise loop,
# a hand-driven lap of the aisle ring around the central block, replayed
# 2026-10-02 from the board cold start (log/indoor-test/loop_cw_path.csv,
# 1305 poses, 78 m, no jumps; docs/roadmaps/8-autonomous-driving.md, L1).
# Decimated to 0.5 m spacing, the stationary tail dropped, smoothed with a
# 5-point wrap-around moving average, and closed: first point repeated last.
#
# Direction of travel is the drive's: clockwise seen from above, leaving the
# board spot westward. Corners were driven at about 3.3 to 4.1 m radius.
#
# Rebuild the lanelet with:
#   python3 scripts/map/centerline_to_lanelet.py data/basement-indoor/route_loop_cw.yaml \
#       --map-dir data/basement-indoor --smoothing 0 --write
